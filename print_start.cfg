# print_start.cfg — slicer entry PRINT_START and internal phase helpers.
#
# Phases (orchestrated by PRINT_START):
#   1) Init + early preheat     -> _PRINT_START_PHASE_INIT_PREHEAT
#   2) Home                     -> G28 (kept here so order stays obvious)
#   3) Bed soak / stabilization -> _PRINT_START_PHASE_BED_SOAK
#   4) Z tilt or QGL            -> inline (printer-dependent, short)
#   5) Optional bed mesh        -> _PRINT_START_PHASE_MESH
#   6) Extruder to print temp   -> _PRINT_START_PHASE_EXTRUDER_WAIT
#   7) Purge lines              -> _PURGE_START_LINES
#
# Internal macros (_*) are summarized under PRINT_START in Readme kinematics, not named there.

# ---------------------------------------------------------------------------
# Purge: geometry + extrusion only (expects G90 / M83 already active).
# ---------------------------------------------------------------------------
[gcode_macro _PURGE_START_LINES]
description: |
  Internal: draw adaptive purge lines at the front of the print area.
  Optional MESH_MIN / MESH_MAX (same format as PRINT_START) constrain X span;
  if omitted, uses axis limits minus a fixed bed margin.
gcode:
  # --- Tunables from globals ---
  {% set g = printer["gcode_macro _macro_globals"] %}
  {% set purge_length = g.variable_start_purge_length|float %}
  {% set purge_prime = g.variable_start_purge_prime_length|float %}
  {% set purge_offset_y = g.variable_start_purge_offset_y|float %}
  {% set purge_feedrate = g.variable_start_purge_feedrate|float %}
  {% set x_purge_offset = g.variable_start_purge_offset_x|default(10.0)|float %}
  {% set min_purge_line_length = g.variable_start_purge_min_length|default(100.0)|float %}
  {% set ax_min = printer.toolhead.axis_minimum %}
  {% set ax_max = printer.toolhead.axis_maximum %}
  {% set bed_margin = 15.0 %}
  {% set mesh_min = params.MESH_MIN|default(none) %}
  {% set mesh_max = params.MESH_MAX|default(none) %}

  # --- Approximate extruded volume per mm travel (rect strip model) ---
  {% set nozzle_d = printer.extruder.nozzle_diameter|default(0.4)|float %}
  {% set filament_d = printer.extruder.filament_diameter|default(1.75)|float %}
  {% set purge_width = nozzle_d * 1.25 %}
  {% set purge_layer_h = nozzle_d * 0.6 %}
  {% set vol_per_mm = purge_width * purge_layer_h %}
  {% set mm_per_e = 3.1415 * (filament_d / 2) ** 2 %}

  # --- Purge strip in Y: just below mesh (or below front bed margin) ---
  {% if mesh_min and mesh_max %}
    {% set xmin = mesh_min.split(",")[0]|float %}
    {% set xmax = mesh_max.split(",")[0]|float %}
    {% set ymin = mesh_min.split(",")[1]|float %}
  {% else %}
    {% set xmin = ax_min.x + bed_margin %}
    {% set xmax = ax_max.x - bed_margin %}
    {% set ymin = ax_min.y + bed_margin %}
  {% endif %}
  {% set purge_y = ymin - purge_offset_y %}
  {% set purge_y_clamped = [purge_y, ax_min.y + 1.0]|max %}
  {% set width = xmax - xmin %}

  {% if printer.extruder.can_extrude and width > 1.0 and purge_length > 0 %}
    # Prime line: approach from the side, zig-zag along X, reset E.
    G92 E0
    {% set line_length = [width, min_purge_line_length]|max %}
    {% set effective_line_e = (line_length * vol_per_mm) / mm_per_e %}
    {% set line_count = (purge_length / line_length)|round(0, 'ceil') %}
    G1 Z2.0 F900
    {% set raw_pre_x = xmin - x_purge_offset %}
    {% if raw_pre_x < ax_min.x %}
      RESPOND TYPE=echo MSG="Adjusted purge X-start to stay within print area"
      {% set pre_start_x = ax_min.x %}
    {% else %}
      {% set pre_start_x = raw_pre_x %}
    {% endif %}
    G1 X{pre_start_x} Y{purge_y_clamped} F6000
    G1 Z{purge_layer_h}|round(3) F300
    G1 E{purge_prime} F300
    G1 X{xmin} Y{purge_y_clamped} F600
    {% for i in range(line_count) %}
      {% set y = purge_y_clamped + i * 0.4 %}
      {% if i % 2 == 0 %}
        G1 X{xmax} Y{y} E{effective_line_e} F{purge_feedrate}
      {% else %}
        G1 X{xmin} Y{y} E{effective_line_e} F{purge_feedrate}
      {% endif %}
    {% endfor %}
    G92 E0
  {% elif not printer.extruder.can_extrude %}
    RESPOND TYPE=echo MSG="PRINT_START: skip purge (extruder not ready to extrude)"
  {% endif %}

# ---------------------------------------------------------------------------
# PRINT_START phase helpers (params keep PRINT_START jinja small and readable).
# ---------------------------------------------------------------------------
[gcode_macro _PRINT_START_PHASE_INIT_PREHEAT]
description: Internal. M117/M118, fans/pause clear, G90/M83, first bed and nozzle targets.
gcode:
  M117 Starting...
  M118 ===> PHASE INIT
  M107
  CLEAR_PAUSE
  G90
  M83
  M140 S{params.OVERSHOOT|float}
  M104 S{params.EXT_PREHEAT|float}

[gcode_macro _PRINT_START_PHASE_BED_SOAK]
description: Internal. Wait on overshoot bed temp, dwell, then final bed temp and dwell.
gcode:
  M118 ===> PHASE BED WAIT
  M190 S{params.OVERSHOOT|float}
  G4 P{params.DELAY_MS|int}
  M140 S{params.BED|float}
  M190 S{params.BED|float}
  G4 P{params.DELAY_MS|int}

[gcode_macro _PRINT_START_PHASE_MESH]
description: Internal. Adaptive or bounded BED_MESH_CALIBRATE, or eddy NG experimental path.
gcode:
  {% set mesh_min = params.MESH_MIN %}
  {% set mesh_max = params.MESH_MAX %}
  {% set bm_cal = printer.gcode.command_templates|default({}) %}
  {% set use_kalico = "BED_MESH_CALIBRATE" in bm_cal and
        "ADAPTIVE" in bm_cal["BED_MESH_CALIBRATE"].template %}
  {% set has_probe_eddy = printer.configfile.config|dictsort|map(attribute=0)|select("match", "^probe_eddy_")|list|length > 0 %}
  {% set has_probe_eddy_ng = printer.configfile.config|dictsort|map(attribute=0)|select("match", "^probe_eddy_ng")|list|length > 0 %}
  M104 S{params.EXT_PREHEAT|float}
  M118 ===> PHASE MESH
  {% if printer.bed_mesh %}
    BED_MESH_CLEAR
  {% endif %}
  {% if has_probe_eddy_ng %}
    {% set center_x = ((mesh_min.split(",")[0]|float) + (mesh_max.split(",")[0]|float)) / 2 %}
    {% set center_y = ((mesh_min.split(",")[1]|float) + (mesh_max.split(",")[1]|float)) / 2 %}
    G1 Z10 F900
    G1 X{center_x} Y{center_y} F6000
    PROBE_EDDY_NG_TAP
    EDDYNG_BED_MESH_EXPERIMENTAL
  {% else %}
    {% set args = [] %}
    {% if use_kalico %}
      {% do args.append("ADAPTIVE=1") %}
    {% else %}
      {% do args.append("MIN=" ~ mesh_min) %}
      {% do args.append("MAX=" ~ mesh_max) %}
    {% endif %}
    {% if has_probe_eddy %}
      {% do args.append("METHOD=rapid_scan") %}
    {% endif %}
    BED_MESH_CALIBRATE {{ args|join(" ") }}
  {% endif %}

[gcode_macro _PRINT_START_PHASE_EXTRUDER_WAIT]
description: Internal. Bring extruder to full print temperature after homing/mesh.
gcode:
  M118 ===> PHASE EXTRUDER
  M104 S{params.TARGET|float}
  M109 S{params.TARGET|float}

# ---------------------------------------------------------------------------
# Public: full start sequence (slicer should call this once per print).
# ---------------------------------------------------------------------------
[gcode_macro PRINT_START]
description: |
  Smart and adaptive start procedure for Klipper.
  Handles synchronized heating, homing, Z tilt alignment, mesh calibration,
  and filament purging. Most behavior is configurable via `_macro_globals`.

gcode:
  # --- Globals: preheat / bed timing ---
  {% set g = printer["gcode_macro _macro_globals"] %}
  {% set preheat_scale = g.variable_start_extruder_preheat_scale|float %}
  {% set bed_overshoot = g.variable_start_bed_heat_overshoot|float %}
  {% set bed_delay_sec = g.variable_start_bed_heat_delay|float %}
  {% set bed_delay_ms = (bed_delay_sec * 500)|int %}

  # --- Slicer inputs ---
  {% set bed_temp = params.BED|float %}
  {% set ext_temp = params.EXTRUDER|float %}
  {% set mesh_min = params.MESH_MIN|default(none) %}
  {% set mesh_max = params.MESH_MAX|default(none) %}
  {% set bed_max_temp = printer.configfile.settings.heater_bed.max_temp|float %}
  {% set bed_overshoot_target = [bed_temp + bed_overshoot, bed_max_temp]|min %}
  {% set ext_preheat = ext_temp * preheat_scale %}

  # --- Optional kinematic features (mesh path and tilt depend on these) ---
  {% set z_tilt_enable = "z_tilt" in printer %}
  {% set qgl_enable = "quad_gantry" in printer %}

  # Phase 1–2: safe modes, first heater targets, then full home.
  _PRINT_START_PHASE_INIT_PREHEAT OVERSHOOT={bed_overshoot_target} EXT_PREHEAT={ext_preheat}
  G28

  # Phase 3: bed overshoot soak, then settle at target bed temp.
  _PRINT_START_PHASE_BED_SOAK OVERSHOOT={bed_overshoot_target} BED={bed_temp} DELAY_MS={bed_delay_ms}

  # Phase 4: level gantry / bed mechanics before probing (if printer has the feature).
  {% if z_tilt_enable %}
    M118 ===> PHASE Z_TILT
    Z_TILT_ADJUST
  {% elif qgl_enable %}
    M118 ===> PHASE QGL
    QUAD_GANTRY_LEVEL
  {% endif %}

  # Phase 5: mesh only when slicer passed first-layer bounds (saves probe time otherwise).
  {% if mesh_min and mesh_max %}
    _PRINT_START_PHASE_MESH MESH_MIN={mesh_min} MESH_MAX={mesh_max} EXT_PREHEAT={ext_preheat}
  {% endif %}

  # Phase 6: full extruder temp only after mechanical / mesh work (reduces ooze on bed).
  {% if ext_temp > 0 %}
    _PRINT_START_PHASE_EXTRUDER_WAIT TARGET={ext_temp}
  {% endif %}

  # Phase 7: prime line / purge in front of the print area.
  M118 ===> PHASE PURGE
  {% if mesh_min and mesh_max %}
    _PURGE_START_LINES MESH_MIN={mesh_min} MESH_MAX={mesh_max}
  {% else %}
    _PURGE_START_LINES
  {% endif %}

  {% if 'LAYERS' in params %}
    INIT_LAYER_GCODE LAYERS={params.LAYERS}
  {% endif %}
  M117 Ready

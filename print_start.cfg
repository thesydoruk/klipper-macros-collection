[gcode_macro PRINT_START]
description: |
  Smart and adaptive start procedure for Klipper.
  Handles synchronized heating, homing, Z tilt alignment, mesh calibration,
  and filament purging. Most behavior is configurable via `_macro_globals`.

gcode:
  # === Load shared configuration from _macro_globals ===
  {% set g = printer["gcode_macro _macro_globals"] %}

  {% set purge_length = g.variable_start_purge_length|float %}
  {% set purge_prime = g.variable_start_purge_prime_length|float %}
  {% set preheat_scale = g.variable_start_extruder_preheat_scale|float %}
  {% set bed_overshoot = g.variable_start_bed_heat_overshoot|float %}
  {% set bed_delay_sec = g.variable_start_bed_heat_delay|float %}
  {% set purge_offset_y = g.variable_start_purge_offset_y|float %}
  {% set purge_feedrate = g.variable_start_purge_feedrate|float %}
  {% set x_purge_offset = g.variable_start_purge_offset_x|default(10.0)|float %}
  {% set min_purge_line_length = g.variable_start_purge_min_length|default(100.0)|float %}

  # === Read slicer-provided parameters ===
  {% set bed_temp = params.BED|float %}
  {% set ext_temp = params.EXTRUDER|float %}
  {% set mesh_min = params.MESH_MIN|default(none) %}
  {% set mesh_max = params.MESH_MAX|default(none) %}
  {% set ax_min = printer.toolhead.axis_minimum %}
  {% set ax_max = printer.toolhead.axis_maximum %}
  {% set bed_margin = 15.0 %}
  {% set bed_max_temp = printer.configfile.settings.heater_bed.max_temp|float %}
  {% set bed_overshoot_target = [bed_temp + bed_overshoot, bed_max_temp]|min %}

  # === Compute purge extrusion dimensions ===
  {% set nozzle_d = printer.extruder.nozzle_diameter|default(0.4)|float %}
  {% set filament_d = printer.extruder.filament_diameter|default(1.75)|float %}
  {% set purge_width = nozzle_d * 1.25 %}
  {% set purge_layer_h = nozzle_d * 0.6 %}
  {% set vol_per_mm = purge_width * purge_layer_h %}
  {% set mm_per_e = 3.1415 * (filament_d / 2) ** 2 %}

  # === Detect supported features ===
  {% set bm_cal = printer.gcode.command_templates|default({}) %}
  {% set use_kalico = "BED_MESH_CALIBRATE" in bm_cal and
        "ADAPTIVE" in bm_cal["BED_MESH_CALIBRATE"].template %}
  {% set has_probe_eddy = printer.configfile.config|dictsort|map(attribute=0)|select("match", "^probe_eddy_")|list|length > 0 %}
  {% set has_probe_eddy_ng = printer.configfile.config|dictsort|map(attribute=0)|select("match", "^probe_eddy_ng")|list|length > 0 %}
  {% set z_tilt_enable = "z_tilt" in printer %}
  {% set qgl_enable = "quad_gantry" in printer %}

  # === PHASE INIT ===
  M117 Starting...
  M118 ===> PHASE INIT
  M107
  CLEAR_PAUSE
  G90
  M83

  # === PHASE PREHEAT BED ===
  M140 S{bed_overshoot_target}
  M104 S{ext_temp * preheat_scale}

  # === PHASE HOME ===
  G28

  # === PHASE BED WAIT ===
  M118 ===> PHASE BED WAIT
  M190 S{bed_overshoot_target}
  G4 P{int(bed_delay_sec * 500)}
  M140 S{bed_temp}
  M190 S{bed_temp}
  G4 P{int(bed_delay_sec * 500)}

  # === PHASE Z_TILT / QGL (if supported) ===
  {% if z_tilt_enable %}
    M118 ===> PHASE Z_TILT
    Z_TILT_ADJUST
  {% elif qgl_enable %}
    M118 ===> PHASE QGL
    QUAD_GANTRY_LEVEL
  {% endif %}

  # === PHASE MESH (keep extruder at preheat during probes to limit ooze on the bed) ===
  {% if mesh_min and mesh_max %}
    M104 S{ext_temp * preheat_scale}
    M118 ===> PHASE MESH
    {% if printer.bed_mesh %}
      BED_MESH_CLEAR
    {% endif %}

    {% if has_probe_eddy_ng %}
      {% set center_x = ((mesh_min.split(",")[0]|float) + (mesh_max.split(",")[0]|float)) / 2 %}
      {% set center_y = ((mesh_min.split(",")[1]|float) + (mesh_max.split(",")[1]|float)) / 2 %}
      G1 Z10 F900
      G1 X{center_x} Y{center_y} F6000
      PROBE_EDDY_NG_TAP
      EDDYNG_BED_MESH_EXPERIMENTAL
    {% else %}
      {% set args = [] %}
      {% if use_kalico %}
        {% do args.append("ADAPTIVE=1") %}
      {% else %}
        {% do args.append("MIN=" ~ mesh_min) %}
        {% do args.append("MAX=" ~ mesh_max) %}
      {% endif %}
      {% if has_probe_eddy %}
        {% do args.append("METHOD=rapid_scan") %}
      {% endif %}
      BED_MESH_CALIBRATE {{ args|join(" ") }}
    {% endif %}
  {% endif %}

  # === PHASE EXTRUDER (full temp only after mesh / homing sequence) ===
  {% if ext_temp > 0 %}
    M118 ===> PHASE EXTRUDER
    M104 S{ext_temp}
    M109 S{ext_temp}
  {% endif %}

  # === PHASE PURGE ===
  M118 ===> PHASE PURGE
  {% if mesh_min and mesh_max %}
    {% set xmin = mesh_min.split(",")[0]|float %}
    {% set xmax = mesh_max.split(",")[0]|float %}
    {% set ymin = mesh_min.split(",")[1]|float %}
  {% else %}
    {% set xmin = ax_min.x + bed_margin %}
    {% set xmax = ax_max.x - bed_margin %}
    {% set ymin = ax_min.y + bed_margin %}
  {% endif %}
  {% set purge_y = ymin - purge_offset_y %}
  {% set purge_y_clamped = [purge_y, ax_min.y + 1.0]|max %}
  {% set width = xmax - xmin %}

  {% if printer.extruder.can_extrude and width > 1.0 and purge_length > 0 %}
    G92 E0
    {% set line_length = [width, min_purge_line_length]|max %}
    {% set effective_line_e = (line_length * vol_per_mm) / mm_per_e %}
    {% set line_count = (purge_length / line_length)|round(0, 'ceil') %}

    G1 Z2.0 F900
    {% set raw_pre_x = xmin - x_purge_offset %}
    {% if raw_pre_x < ax_min.x %}
      RESPOND TYPE=echo MSG="Adjusted purge X-start to stay within print area"
      {% set pre_start_x = ax_min.x %}
    {% else %}
      {% set pre_start_x = raw_pre_x %}
    {% endif %}
    G1 X{pre_start_x} Y{purge_y_clamped} F6000
    G1 Z{purge_layer_h}|round(3) F300
    G1 E{purge_prime} F300
    G1 X{xmin} Y{purge_y_clamped} F600

    {% for i in range(line_count) %}
      {% set y = purge_y_clamped + i * 0.4 %}
      {% if i % 2 == 0 %}
        G1 X{xmax} Y{y} E{effective_line_e} F{purge_feedrate}
      {% else %}
        G1 X{xmin} Y{y} E{effective_line_e} F{purge_feedrate}
      {% endif %}
    {% endfor %}

    G92 E0
  {% elif not printer.extruder.can_extrude %}
    RESPOND TYPE=echo MSG="PRINT_START: skip purge (extruder not ready to extrude)"
  {% endif %}
  M117 Ready

[gcode_macro PRINT_START]
description: |
  Smart and adaptive start procedure for Klipper.
  Handles synchronized heating, homing, Z tilt alignment, mesh calibration,
  and filament purging. Most behavior is configurable via `_macro_globals`.

gcode:
  # === Load shared configuration from _macro_globals ===
  {% set g = printer["gcode_macro _macro_globals"] %}

  {% set purge_length = g.variable_start_purge_length|float %}
  {% set purge_prime = g.variable_start_purge_prime_length|float %}
  {% set preheat_scale = g.variable_start_extruder_preheat_scale|float %}
  {% set bed_overshoot = g.variable_start_bed_heat_overshoot|float %}
  {% set bed_delay_sec = g.variable_start_bed_heat_delay|float %}
  {% set purge_offset_y = g.variable_start_purge_offset_y|float %}
  {% set purge_feedrate = g.variable_start_purge_feedrate|float %}
  {% set x_purge_offset = g.variable_start_purge_offset_x|default(10.0)|float %}

  # === Read slicer-provided parameters ===
  {% set bed_temp = params.BED|float %}
  {% set ext_temp = params.EXTRUDER|float %}
  {% set mesh_min = params.MESH_MIN|default(none) %}
  {% set mesh_max = params.MESH_MAX|default(none) %}

  # === Compute purge extrusion dimensions ===
  {% set nozzle_d = printer.extruder.nozzle_diameter|default(0.4)|float %}
  {% set filament_d = printer.extruder.filament_diameter|default(1.75)|float %}
  {% set purge_width = nozzle_d * 1.25 %}
  {% set vol_per_mm = purge_width * 0.2 %}  {# assumed layer height #}
  {% set mm_per_e = 3.1415 * (filament_d / 2) ** 2 %}

  # === Detect supported features ===
  {% set use_kalico = "ADAPTIVE" in printer.gcode.command_templates["BED_MESH_CALIBRATE"].template %}
  {% set has_probe_eddy = printer.configfile.config|dictsort|map(attribute=0)|select("match", "^probe_eddy_")|list|length > 0 %}
  {% set has_probe_eddy_ng = printer.configfile.config|dictsort|map(attribute=0)|select("match", "^probe_eddy_ng ")|list|length > 0 %}
  {% set z_tilt_enable = "z_tilt" in printer %}

  # === PHASE INIT ===
  M117 Starting...
  M118 ===> PHASE INIT
  G90
  M83

  # === PHASE PREHEAT BED ===
  M140 S{bed_temp + bed_overshoot}
  M104 S{ext_temp * preheat_scale}

  # === PHASE HOME ===
  G28

  # === PHASE BED WAIT ===
  M118 ===> PHASE BED WAIT
  M190 S{bed_temp}
  G4 P{int(bed_delay_sec * 1000)}

  # === PHASE Z_TILT (if supported) ===
  {% if z_tilt_enable %}
    M118 ===> PHASE Z_TILT
    Z_TILT_ADJUST
  {% endif %}

  # === PHASE EXTRUDER HEAT ===
  M118 ===> PHASE EXTRUDER
  M104 S{ext_temp}
  M109 S{ext_temp}

  # === PHASE MESH LEVELING ===
  {% if mesh_min and mesh_max %}
    M118 ===> PHASE MESH

    {% if has_probe_eddy_ng %}
      {% set center_x = ((mesh_min.split(",")[0]|float) + (mesh_max.split(",")[0]|float)) / 2 %}
      {% set center_y = ((mesh_min.split(",")[1]|float) + (mesh_max.split(",")[1]|float)) / 2 %}
      G1 Z10 F900
      G1 X{center_x} Y{center_y} F6000
      PROBE_EDDY_NG_TAP
      EDDYNG_BED_MESH_EXPERIMENTAL
    {% else %}
      {% set args = [] %}
      {% if use_kalico %}
        {% do args.append("ADAPTIVE=1") %}
      {% else %}
        {% do args.append("MIN=" ~ mesh_min) %}
        {% do args.append("MAX=" ~ mesh_max) %}
      {% endif %}
      {% if has_probe_eddy %}
        {% do args.append("METHOD=rapid_scan") %}
      {% endif %}
      BED_MESH_CALIBRATE {{ args|join(" ") }}
    {% endif %}
  {% endif %}

  # === PHASE PURGE ===
  M118 ===> PHASE PURGE
  G92 E0

  {% set xmin = mesh_min.split(",")[0]|float %}
  {% set xmax = mesh_max.split(",")[0]|float %}
  {% set ymin = mesh_min.split(",")[1]|float %}
  {% set purge_y = ymin - purge_offset_y %}
  {% set width = xmax - xmin %}
  {% set line_e = (width * vol_per_mm) / mm_per_e %}
  {% set line_count = (purge_length / width)|round(0, 'ceil') %}

  G1 Z2.0 F900
  {% set raw_pre_x = xmin - x_purge_offset %}
  {% if raw_pre_x < printer.toolhead.axis_minimum.x %}
    RESPOND TYPE=echo MSG="Adjusted purge X-start to stay within print area"
    {% set pre_start_x = printer.toolhead.axis_minimum.x %}
  {% else %}
    {% set pre_start_x = raw_pre_x %}
  {% endif %}
  G1 X{pre_start_x} Y{purge_y} F6000
  G1 Z{nozzle_d * 0.6}|round(3) F300  ; set purge height based on nozzle diameter (60%)
  G1 E{purge_prime} F300
  G1 X{xmin} Y{purge_y} F600

  {% for i in range(line_count) %}
    {% set y = purge_y + i * 0.4 %}
    {% if i % 2 == 0 %}
      G1 X{xmax} Y{y} E{line_e} F{purge_feedrate}
    {% else %}
      G1 X{xmin} Y{y} E{line_e} F{purge_feedrate}
    {% endif %}
  {% endfor %}

  G92 E0
  M117 Ready

[gcode_macro PRINT_START]
description: Prepares printer for printing. Handles preheating, homing,
  tilt, mesh, purge, and toolhead readiness.

gcode:
  # === Load config from shared macro ===
  {% set ps = printer["gcode_macro _print_settings"] %}
  {% set purge_length = ps.variable_start_purge_length|default(30.0)|float %}
  {% set purge_prime = ps.variable_start_purge_prime_length|default(5.0)|float %}
  {% set preheat_scale = ps.variable_start_extruder_preheat_scale|default(0.5)|float %}
  {% set bed_overshoot = ps.variable_start_bed_heat_overshoot|default(2.0)|float %}
  {% set bed_delay_sec = ps.variable_start_bed_heat_delay|default(2.0)|float %}
  {% set purge_offset_y = ps.variable_start_purge_offset_y|default(5.0)|float %}
  {% set purge_feedrate = ps.variable_start_purge_feedrate|default(1200.0)|float %}
  {% set nozzle_d = printer.extruder.nozzle_diameter|default(0.4) %}
  {% set purge_height = nozzle_d * 0.625 %}
  {% set purge_width = nozzle_d * 1.25 %}

  # === Detect system capabilities ===
  {% set use_kalico = "ADAPTIVE" in printer.gcode.command_templates["BED_MESH_CALIBRATE"].template %}
  {% set has_probe_eddy = printer.configfile.config|dictsort|map(attribute=0)|select("match", "^probe_eddy_")|list|length > 0 %}
  {% set has_probe_eddy_ng = printer.configfile.config|dictsort|map(attribute=0)|select("match", "^probe_eddy_ng ")|list|length > 0 %}
  {% set z_tilt_enable = 'z_tilt' in printer %}

  # === Get slicer parameters ===
  {% set bed_temp = params.BED|float %}
  {% set ext_temp = params.EXTRUDER|float %}
  {% set mesh_min = params.MESH_MIN|default(none) %}
  {% set mesh_max = params.MESH_MAX|default(none) %}

  M117 Starting...
  M118 ===> PHASE INIT
  G90
  M83

  # === Preheat bed and extruder (partial) ===
  M140 S{bed_temp + bed_overshoot}
  M104 S{ext_temp * preheat_scale}

  # === Home ===
  G28

  # === Wait for bed to stabilize ===
  M118 ===> PHASE BED WAIT
  M190 S{bed_temp}
  G4 P{int(bed_delay_sec * 1000)}

  # === Optional Z tilt adjust ===
  {% if z_tilt_enable %}
    M118 ===> PHASE Z_TILT
    Z_TILT_ADJUST
  {% endif %}

  # === Final extruder heat ===
  M118 ===> PHASE EXTRUDER
  M104 S{ext_temp}
  M109 S{ext_temp}

  # === Mesh leveling ===
  {% if mesh_min and mesh_max %}
    M118 ===> PHASE MESH

    {% if has_probe_eddy_ng %}
      # Tap probe before EDDYNG mesh if required
      {% set center_x = ((mesh_min.split(",")[0]|float) + (mesh_max.split(",")[0]|float)) / 2 %}
      {% set center_y = ((mesh_min.split(",")[1]|float) + (mesh_max.split(",")[1]|float)) / 2 %}
      G1 Z10 F900
      G1 X{center_x} Y{center_y} F6000
      PROBE_EDDY_NG_TAP
      EDDYNG_BED_MESH_EXPERIMENTAL
    {% else %}
      # Construct BED_MESH_CALIBRATE command
      {% set args = [] %}
      {% if use_kalico %}
        {% do args.append("ADAPTIVE=1") %}
      {% else %}
        {% do args.append("MIN=" ~ mesh_min) %}
        {% do args.append("MAX=" ~ mesh_max) %}
      {% endif %}
      {% if has_probe_eddy %}
        {% do args.append("METHOD=rapid_scan") %}
      {% endif %}
      BED_MESH_CALIBRATE {{ args|join(" ") }}
    {% endif %}
  {% endif %}

  # === Purge lines ===
  M118 ===> PHASE PURGE
  G92 E0
  {% set xmin = mesh_min.split(",")[0]|float %}
  {% set xmax = mesh_max.split(",")[0]|float %}
  {% set ymin = mesh_min.split(",")[1]|float %}
  {% set purge_y = ymin - purge_offset_y %}
  {% set width = xmax - xmin %}
  {% set vol_per_mm = purge_width * purge_height %}
  {% set mm_per_e = 3.1415 * (1.75 / 2)**2 %}
  {% set line_e = (width * vol_per_mm) / mm_per_e %}
  {% set line_count = (purge_length / width)|round(0, 'ceil') %}

  G1 Z{purge_height + 5} F900
  G1 X{xmin} Y{purge_y} F6000
  G1 Z{purge_height} F300
  G1 E{purge_prime} F300

  {% for i in range(line_count) %}
    {% set y = purge_y + i * purge_height %}
    {% if i % 2 == 0 %}
      G1 X{xmax} Y{y} E{line_e} F{purge_feedrate}
    {% else %}
      G1 X{xmin} Y{y} E{line_e} F{purge_feedrate}
    {% endif %}
  {% endfor %}

  G92 E0
  M117 Ready

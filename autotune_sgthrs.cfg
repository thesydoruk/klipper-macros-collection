[gcode_macro AUTOTUNE_SGTHRS_PHASE]
description: |
  Autotune SGTHRS by running scaled motion patterns and evaluating StallGuard sensitivity.
  A SGTHRS value is considered valid if StallGuard triggers (low SG_RESULT) and motion deviation is detected either logically (MCU delta) or physically (G28 delta).
  Acceleration is fixed during the entire test and can be set manually (default: printer.max_accel).

gcode:
  {% set stepper = params.STEPPER|default("stepper_x") %}
  {% set sg_step = params.STEP|default(5)|int %}
  {% set feed = params.FEED|default(printer.configfile.settings.printer.max_velocity)|int %}
  {% set accel = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
  {% set bound = params.BOUND|default(20)|int %}
  {% set mcu_tol = params.MCU_TOLERANCE|default(0.05)|float %}
  {% set rehome_tol = params.REHOME_TOLERANCE|default(0.05)|float %}
  {% set scale_steps = params.SCALE_STEPS|default(5)|int %}
  {% set sg_threshold = params.SG_OK_THRESHOLD|default(10)|int %}
  {% set success = namespace(best=None) %}

  # === Detect driver prefix dynamically ===
  {% set ns = namespace(driver=None) %}
  {% for prefix in ["tmc2209", "tmc2225", "tmc2226", "tmc5160", "tmc2130", "tmc2660"] %}
    {% set candidate = prefix ~ " " ~ stepper %}
    {% if candidate in printer %}
      {% set ns.driver = candidate %}
      {% break %}
    {% endif %}
  {% endfor %}
  {% if ns.driver is none %}
    RESPOND TYPE=error MSG="Could not detect driver for stepper '%s'" % (stepper,)
    RETURN
  {% endif %}

  {% if "tmc2209" in ns.driver or "tmc2225" in ns.driver or "tmc2226" in ns.driver %}
    {% set default_min = 0 %}
    {% set default_max = 255 %}
    {% set sg_field = "SGTHRS" %}
  {% else %}
    {% set default_min = -64 %}
    {% set default_max = 63 %}
    {% set sg_field = "SGT" %}
  {% endif %}
  {% set min_sg = params.MIN|default(default_min)|int %}
  {% set max_sg = params.MAX|default(default_max)|int %}

  SAVE_GCODE_STATE NAME=AUTOTUNE_SGTHRS
  G90
  M400

  G28
  M400
  G0 Z{bound + 5} F1800
  GET_POSITION
  {% set x0 = printer.toolhead.position.x %}
  {% set y0 = printer.toolhead.position.y %}
  {% set msg = "Reference pos: X=%.3f Y=%.3f"|format(x0, y0) %}

  RESPOND TYPE=echo MSG="{msg}"

  {% set bed_xmin = printer.toolhead.axis_minimum.x + bound %}
  {% set bed_xmax = printer.toolhead.axis_maximum.x - bound %}
  {% set bed_ymin = printer.toolhead.axis_minimum.y + bound %}
  {% set bed_ymax = printer.toolhead.axis_maximum.y - bound %}
  {% set center_x = (bed_xmin + bed_xmax) / 2 %}
  {% set center_y = (bed_ymin + bed_ymax) / 2 %}
  {% set dx = (bed_xmax - bed_xmin) / 3 %}
  {% set dy = (bed_ymax - bed_ymin) / 3 %}

  {% for sg in range(min_sg, max_sg + 1, sg_step) %}
    {% set msg = "🔍 Testing SGTHRS=%d with ACCEL=%d"|format(sg, accel) %}

    RESPOND TYPE=command MSG="{msg}"
    SET_TMC_FIELD STEPPER={stepper} FIELD={sg_field} VALUE={sg}

    {% for i in range(scale_steps) %}
      {% set scale = 1.0 - (i / (scale_steps - 1)) * 0.9 %}
      {% set x_range = dx * scale %}
      {% set y_range = dy * scale %}
      {% set msg = "➡️ Scale=%.2f"|format(scale) %}

      RESPOND TYPE=command MSG="{msg}"

      {% set x1 = center_x - x_range %}
      {% set x2 = center_x + x_range %}
      {% set y1 = center_y - y_range %}
      {% set y2 = center_y + y_range %}

      SET_VELOCITY_LIMIT VELOCITY={feed} ACCEL={accel}
      G0 X{x1} Y{y1} F{feed * 60}
      G0 X{x2} Y{y1} F{feed * 60}
      G0 X{x2} Y{y2} F{feed * 60}
      G0 X{x1} Y{y2} F{feed * 60}
      G0 X{x1} Y{y1} F{feed * 60}
      G0 X{x2} Y{y2} F{feed * 60}
      G0 X{x1} Y{y2} F{feed * 60}
      G0 X{x2} Y{y1} F{feed * 60}
      G0 X{center_x} Y{center_y} F{feed * 60}
      M400
    {% endfor %}

    {% set sg_val = printer[ns.driver].sg_result|default(999) %}
    {% set msg = "📊 SG_RESULT=%d"|format(sg_val) %}

    RESPOND TYPE=echo MSG="{msg}"

    G0 X{x0} Y{y0} F{feed * 60}
    M400
    GET_POSITION
    {% set x1 = printer.toolhead.position.x %}
    {% set y1 = printer.toolhead.position.y %}
    {% set dx_logic = (x1 - x0)|round(4) %}
    {% set dy_logic = (y1 - y0)|round(4) %}
    {% set msg = "🧠 MCU delta: ΔX=%.3f ΔY=%.3f"|format(dx_logic, dy_logic) %}

    RESPOND TYPE=echo MSG="{msg}"

    G28 X Y
    M400
    GET_POSITION
    {% set x2 = printer.toolhead.position.x %}
    {% set y2 = printer.toolhead.position.y %}
    {% set dx_home = (x2 - x0)|round(4) %}
    {% set dy_home = (y2 - y0)|round(4) %}
    {% set msg = "📏 Rehome delta: ΔX=%.3f ΔY=%.3f"|format(dx_home, dy_home) %}

    RESPOND TYPE=echo MSG="{msg}"

    {% set mcu_error = dx_logic|abs > mcu_tol or dy_logic|abs > mcu_tol %}
    {% set rehome_error = dx_home|abs > rehome_tol or dy_home|abs > rehome_tol %}

    {% if sg_val < sg_threshold and (mcu_error or rehome_error) %}
      {% set msg = "✅ SGTHRS=%d VALID — StallGuard + deviation detected"|format(sg) %}

      RESPOND TYPE=echo MSG="{msg}"

      {% set success.best = sg %}
      {% break %}
    {% else %}
      {% set msg = "❌ SGTHRS=%d rejected (no stall or no deviation)"|format(sg) %}

      RESPOND TYPE=echo MSG="{msg}"
    {% endif %}
  {% endfor %}

  {% if success.best is not none %}
    {% if sg_field == "SGTHRS" %}
      {% set config_name = "driver_SGTHRS" %}
    {% else %}
      {% set config_name = "driver_SGT" %}
    {% endif %}
    {% set msg = "🎯 Recommended config line: %s=%d"|format(config_name, success.best) %}

    RESPOND TYPE=echo MSG="{msg}"
  {% else %}
    {% set msg = "❌ No working SGTHRS found in range %d–%d"|format(min_sg, max_sg) %}

    RESPOND TYPE=error MSG="{msg}"
  {% endif %}

  RESTORE_GCODE_STATE NAME=AUTOTUNE_SGTHRS
[gcode_macro PID_E]
description: Run PID calibration for the extruder with optional target temperature (default: 255°C)

gcode:
  # Read the target temperature from parameter T or default to 255°C
  {% set T = params.T|default(255)|float %}

  # Start PID autotune for the extruder
  PID_CALIBRATE HEATER=extruder TARGET={T}
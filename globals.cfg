; Required global variables and includes for Klipper macros

[include print_start.cfg]
[include print_end.cfg]
[include pause_after_d.cfg]
[include pid.cfg]
[include lock_accel.cfg]

[gcode_macro _macro_globals]
# Configuration values used by PRINT_START
variable_start_purge_length: 30.0              # Total amount of filament to purge (mm³)
variable_start_purge_prime_length: 5.0         # Initial prime extrusion before purge lines (mm)
variable_start_extruder_preheat_scale: 0.5     # % of target extruder temp to use for early preheat
variable_start_bed_heat_overshoot: 2.0         # Degrees above target to heat bed for faster stabilization
variable_start_bed_heat_delay: 2.0             # Seconds to wait after bed reaches temp (for thermal stability)
variable_start_purge_offset_y: 5.0             # Distance in front of the mesh area to draw purge lines (mm)
variable_start_purge_offset_x: 10.0            # Horizontal backoff before purge start (mm)
variable_start_purge_feedrate: 1200.0          # Feedrate for purge lines (mm/min)
variable_start_purge_min_length: 100.0         # Minimum length of each purge line (mm)

# Configuration values used by PRINT_END
variable_end_retract_length: 2.0               # Filament retract before parking (mm)
variable_end_lift_z: 10.0                      # Z lift before travel (mm)
variable_end_park_x: min                       # "min", "max" or numeric value for X park
variable_end_park_y: max                       # "min", "max" or numeric value for Y park

# Configuration values for TEST_SPEED
variable_test_speed_default_velocity: 300.0    # Default test speed (mm/s)
variable_test_speed_default_accel: 3000.0      # Default test acceleration (mm/s²)
variable_test_speed_iterations: 5              # Default number of test cycles
variable_test_speed_min_cruise_ratio: 0.5      # Cruise ratio (for junction deviation)
variable_test_speed_bound: 20                  # Safety margin from axis edges (mm)
variable_test_speed_small_pattern_size: 20     # Inner pattern size (mm)

# Z tilt configuration
variable_z_tilt_lift: 8.0                      # Z lift height for first z_tilt pass (mm)

# Quad gantry leveling configuration
variable_qgl_lift: 8.0                         # Z lift height for first coarse QGL pass (mm)

# PID defaults
variable_pid_bed_default_temp: 80.0            # Default PID target for bed (°C)
variable_pid_bed_min: 40.0                     # Minimum safe bed temp (°C)
variable_pid_bed_max: 120.0                    # Maximum safe bed temp (°C)

variable_pid_ext_default_temp: 220.0           # Default PID target for extruder (°C)
variable_pid_ext_min: 160.0                    # Minimum safe hotend temp (°C)
variable_pid_ext_max: 300.0                    # Maximum safe hotend temp (°C)

# SGTHRS autotune defaults
variable_sgthrs_step: 5                        # Step size for SGTHRS
variable_sgthrs_feedrate: 300.0                # Default velocity (mm/s)
variable_sgthrs_accel: 3000.0                  # Default acceleration (mm/s²)
variable_sgthrs_bound: 20                      # Margin from axis limits (mm)
variable_sgthrs_mcu_tol: 0.05                  # Delta threshold for MCU error
variable_sgthrs_rehome_tol: 0.05               # Delta threshold for G28 delta
variable_sgthrs_scale_steps: 5                 # Number of motion scale passes
variable_sgthrs_sg_ok_threshold: 10            # SG_RESULT must be below this to trigger

# PAUSE_AFTER_D check interval
variable_pause_check_interval: 0.3             # Interval between filament usage checks (s)
gcode:

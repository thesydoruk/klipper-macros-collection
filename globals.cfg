; Required global variables and includes for Klipper macros
; Convention: document/call user-facing commands from each module (e.g. LOAD_FILAMENT,
; M701). Names starting with _ are internal helpers or config buckets (_macro_globals).

[include print_start.cfg]
[include print_end.cfg]
[include pid.cfg]
[include lock_accel.cfg]
[include lock_fan.cfg]
[include velocity.cfg]
[include state_guard.cfg]
[include filament.cfg]
[include layers.cfg]
[include optional/print_checkpoint.cfg]

[gcode_macro _macro_globals]
# Configuration values used by PRINT_START
variable_start_purge_length: 30.0              # Scales purge passes: ceil(purge_length / line_length) lines (see PRINT_START; not volumetric mm³)
variable_start_purge_prime_length: 5.0         # Initial prime extrusion before purge lines (mm)
variable_start_extruder_preheat_scale: 0.5     # % of target extruder temp to use for early preheat
variable_start_bed_heat_overshoot: 2.0         # Degrees above target to heat bed for faster stabilization
variable_start_bed_heat_delay: 2.0             # Seconds to wait after bed reaches temp (for thermal stability)
variable_start_purge_offset_y: 5.0             # Distance in front of the mesh area to draw purge lines (mm)
variable_start_purge_offset_x: 10.0            # Horizontal backoff before purge start (mm)
variable_start_purge_feedrate: 1200.0          # Feedrate for purge lines (mm/min)
variable_start_purge_min_length: 100.0         # Minimum length of each purge line (mm)

# Configuration values used by PRINT_END
variable_end_retract_length: 2.0               # Filament retract before parking (mm)
variable_end_lift_z: 10.0                      # Z lift before travel (mm)
variable_end_park_x: "min"                     # "min", "max" or numeric value for X park
variable_end_park_y: "max"                     # "min", "max" or numeric value for Y park

# Configuration values for TEST_SPEED
variable_test_speed_default_velocity: 300.0    # Default test speed (mm/s)
variable_test_speed_default_accel: 3000.0      # Default test acceleration (mm/s²)
variable_test_speed_iterations: 5              # Default number of test cycles
variable_test_speed_min_cruise_ratio: 0.5      # Cruise ratio (for junction deviation)
variable_test_speed_bound: 20                  # Safety margin from axis edges (mm)
variable_test_speed_small_pattern_size: 20     # Inner pattern size (mm)

# Z tilt configuration
variable_z_tilt_lift: 8.0                      # Z lift height for first z_tilt pass (mm)

# Quad gantry leveling configuration
variable_qgl_lift: 8.0                         # Z lift height for first coarse QGL pass (mm)

# PID defaults
variable_pid_bed_temp: 80.0                    # Default PID target for bed (°C)
variable_pid_ext_temp: 220.0                   # Default PID target for extruder (°C)

# SGTHRS autotune defaults
variable_sgthrs_step: 5                        # Step size for SGTHRS
variable_sgthrs_feedrate: 300.0                # Default velocity (mm/s)
variable_sgthrs_accel: 3000.0                  # Default acceleration (mm/s²)
variable_sgthrs_move_range: 50                 # Movement range from center to edge of the square pattern (mm)
variable_sgthrs_z_safe: 20                     # Safe Z height for testing (mm)
variable_sgthrs_mcu_tol: 0.05                  # Delta threshold for MCU error
variable_sgthrs_rehome_tol: 0.5                # Delta threshold for G28 delta
variable_sgthrs_sg_ok_threshold: 10            # SG_RESULT must be below this to trigger
variable_sgthrs_sg_min: 0                     # First SGTHRS/SGT value to try (AUTOTUNE_SGTHRS_PHASE)
variable_sgthrs_sg_max: 60                   # Last SGTHRS/SGT value to try

# PAUSE_AFTER_D check interval
variable_pause_check_interval: 0.3             # Interval between filament usage checks (s)

# optional/print_checkpoint.cfg — SD bookmark interval when ENABLE_PRINT_CHECKPOINT is used
variable_checkpoint_interval: 10.0            # Seconds between SAVE_VARIABLE writes (>= 2)

# PAUSE / RESUME (state_guard): after stock pause, lift Z then park XY; RESUME moves back then stock RESUME
variable_pause_lift_z: 5.0                     # Relative Z lift after pause (mm), 0 to skip
variable_pause_lift_feedrate: 360.0          # Z lift feedrate (mm/min)
variable_pause_park_x: "max"                    # Park X: "min", "max", or number (mm)
variable_pause_park_y: "max"                    # Park Y: "min", "max", or number (mm)
variable_pause_park_feedrate: 6000.0           # XY feedrate for park and return moves (mm/min)

# LOAD_FILAMENT / UNLOAD_FILAMENT / M701 / M702 (filament.cfg)
variable_filament_load_length: 80.0           # Default total load/unload stroke (mm); priming subtracted on load
variable_filament_load_priming_length: 12.0   # Final prime segment after main load (mm)
variable_filament_load_speed: 600             # Main load/unload feedrate (mm/min)
variable_filament_priming_speed: 300         # Cap for prime / shaping moves (mm/min)
variable_filament_min_temp_offset: 5.0       # Default preheat target = min_extrude_temp + this (C)
variable_filament_unload_pre_prime: 5.0      # Short forward push before unload tip sequence (mm)
variable_filament_unload_shaping_moves: 5    # Tip shaping oscillation count on unload
variable_filament_idle_lift_z: 8.0           # M701/M702 when idle: relative Z lift (mm), 0=off
variable_filament_idle_lift_feedrate: 360.0 # Z feedrate for idle lift (mm/min)
variable_filament_beep_count: 2              # M300 beeps after load/unload; 0 = none

# LOCK_FAN defaults
variable_fan_name: "fan"                       # Name of the protected fan object (usually the default [fan])

# velocity.cfg — M900 pressure advance scale (1.0 = use K as-is; 0 or negative = ignore M900)
variable_pressure_advance_scale: 1.0
gcode:

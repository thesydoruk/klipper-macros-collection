[gcode_macro PID_B]
description: |
  Run PID calibration (autotune) for the heated bed.
  This macro fetches default, min, and max temperatures from _macro_globals.
  It safely checks the requested temperature and starts Klipper's PID autotune.

  Parameters:
    T: Target temperature in °C (optional)

  Example:
    PID_B T=70       ; custom temp
    PID_B            ; uses default from globals

gcode:
  # === Load temperature bounds from globals ===
  {% set g = printer["gcode_macro _macro_globals"] %}
  {% set T = params.T|default(g.variable_pid_bed_default_temp)|float %}
  {% set Tmin = g.variable_pid_bed_min|float %}
  {% set Tmax = g.variable_pid_bed_max|float %}

  # === Validate temperature is within safe range ===
  {% if T < Tmin or T > Tmax %}
    RESPOND TYPE=error MSG="PID_B: Temperature %.1f°C out of safe range (%.1f–%.1f°C)" % (T, Tmin, Tmax)
    RETURN
  {% endif %}

  # === Notify user and run PID autotune ===
  M117 PID tune BED @ {T|int}°C
  RESPOND TYPE=echo MSG="PID_B: Starting PID autotune for heater_bed at %d°C" % (T|int)
  PID_CALIBRATE HEATER=heater_bed TARGET={T}


[gcode_macro PID_E]
description: |
  Run PID calibration (autotune) for the hotend.
  This macro uses default/min/max temperatures from _macro_globals.
  It ensures safe bounds and runs Klipper PID autotune accordingly.

  Parameters:
    T: Target temperature in °C (optional)

  Example:
    PID_E T=210      ; custom temp
    PID_E            ; uses default from globals

gcode:
  # === Load temperature bounds from globals ===
  {% set g = printer["gcode_macro _macro_globals"] %}
  {% set T = params.T|default(g.variable_pid_ext_default_temp)|float %}
  {% set Tmin = g.variable_pid_ext_min|float %}
  {% set Tmax = g.variable_pid_ext_max|float %}

  # === Validate temperature is within safe range ===
  {% if T < Tmin or T > Tmax %}
    RESPOND TYPE=error MSG="PID_E: Temperature %.1f°C out of safe range (%.1f–%.1f°C)" % (T, Tmin, Tmax)
    RETURN
  {% endif %}

  # === Notify user and run PID autotune ===
  M117 PID tune HOTEND @ {T|int}°C
  RESPOND TYPE=echo MSG="PID_E: Starting PID autotune for extruder at %d°C" % (T|int)
  PID_CALIBRATE HEATER=extruder TARGET={T}

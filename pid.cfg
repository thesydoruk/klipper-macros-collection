[gcode_macro PID_ALL]
description: |
  Perform PID autotune for all extruders and the heated bed in sequence,
  then save the tuned values to the configuration.
  Default temperatures are taken from `_macro_globals`.

gcode:
  {% set g = printer["gcode_macro _macro_globals"] %}
  {% set extr_temp = g.variable_pid_ext_temp|int %}
  {% set bed_temp  = g.variable_pid_bed_temp|int %}
  {% set tuned = [] %}

  # Tune each extruder that exists
  {% for i in range(0, 10) %}
    {% set h = "extruder" if i == 0 else "extruder" ~ i %}
    {% if printer["heater " ~ h] is defined %}
      {% if printer.display is defined %}
        M117 🔧 PID tune {h.upper()} @ {extr_temp}°C
      {% endif %}
      RESPOND TYPE=echo MSG="🔧 PID_ALL: Tuning {h} at {extr_temp}°C"
      PID_CALIBRATE HEATER={h} TARGET={extr_temp}
      RESPOND TYPE=echo MSG="🎉 PID_ALL: Completed tuning of {h}"
      {% do tuned.append(h) %}
    {% endif %}
  {% endfor %}

  # Tune the bed
  {% if printer.display is defined %}
    M117 🔧 PID tune BED @ {bed_temp}°C
  {% endif %}
  RESPOND TYPE=echo MSG="🔧 PID_ALL: Tuning heater_bed at {bed_temp}°C"
  PID_CALIBRATE HEATER=heater_bed TARGET={bed_temp}
  RESPOND TYPE=echo MSG="🎉 PID_ALL: Completed tuning of heater_bed"
  {% do tuned.append("heater_bed") %}

  # Save all tuned values
  SAVE_CONFIG
  RESPOND TYPE=echo MSG="💾 PID_ALL: Saved PID for {tuned|join(', ')}"

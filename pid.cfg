[gcode_macro PID_B]
description: |
  Run PID calibration (autotune) for the heated bed.
  - Uses Klipper's built-in PID_CALIBRATE.
  - Accepts optional temperature parameter `T` in °C.
  - Defaults to 80°C if not provided.
  - Prints a message before starting the tune.

  Parameters:
    T: Target temperature in °C (optional, default = 80)

  Example:
    PID_B T=70
    PID_B        ; uses 80 by default

gcode:
  # === Read and validate temperature parameter ===
  {% set T = params.T|default(80)|float %}
  {% if T < 40 or T > 120 %}
    RESPOND TYPE=error MSG="PID_B: Temperature %.1f°C out of safe range (40–120°C)" % (T,)
    RETURN
  {% endif %}

  # === Notify user and start autotune ===
  M117 PID tune BED @ {T|int}°C
  RESPOND TYPE=echo MSG="PID_B: Starting PID autotune for heater_bed at %d°C" % (T|int,)
  PID_CALIBRATE HEATER=heater_bed TARGET={T}

[gcode_macro PID_E]
description: |
  Run PID calibration (autotune) for the extruder heater.
  - Uses Klipper's built-in PID_CALIBRATE.
  - Accepts optional temperature parameter `T` in °C.
  - Defaults to 220°C if not provided.
  - Notifies the user before starting the tune.

  Parameters:
    T: Target temperature in °C (optional, default = 220)

  Example:
    PID_E T=200
    PID_E         ; uses 220 by default

gcode:
  # === Read and validate target temperature ===
  {% set T = params.T|default(220)|float %}
  {% if T < 160 or T > 300 %}
    RESPOND TYPE=error MSG="PID_E: Temperature %.1f°C out of safe range (160–300°C)" % (T,)
    RETURN
  {% endif %}

  # === Notify user and start autotune ===
  M117 PID tune HOTEND @ {T|int}°C
  RESPOND TYPE=echo MSG="PID_E: Starting PID autotune for extruder at %d°C" % (T|int,)
  PID_CALIBRATE HEATER=extruder TARGET={T}

[gcode_macro PID_B]
description: Run PID calibration for the heated bed with optional target temperature (default: 80°C)

gcode:
  # Read the target temperature from parameter T or default to 80°C
  {% set T = params.T|default(80)|float %}

  # Start PID autotune for the bed heater
  PID_CALIBRATE HEATER=heater_bed TARGET={T}
[gcode_macro PID_B]
description: |
  Run PID calibration (autotune) for the heated bed.
  - Uses Klipper'єs built-in PID_CALIBRATE.
  - Accepts optional temperature parameter `T` in °C.
  - Defaults to 80°C if not provided.
  - Prints a message before starting the tune.

  Parameters:
    T: Target temperature in °C (optional, default = 80)

  Example:
    PID_B T=70
    PID_B        ; uses 80 by default

gcode:
  # === Read and validate temperature parameter ===
  {% set T = params.T|default(80)|float %}
  {% if T < 40 or T > 120 %}
    RESPOND TYPE=error MSG="PID_B: Temperature out of safe range (40–120°C)"
    RETURN
  {% endif %}

  # === Notify user and start autotune ===
  M117 PID tune BED @ {T|int}°C
  RESPOND TYPE=info MSG="PID_B: Starting PID autotune for heater_bed at {T|int}°C"
  PID_CALIBRATE HEATER=heater_bed TARGET={T}

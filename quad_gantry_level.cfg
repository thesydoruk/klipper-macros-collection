[gcode_macro QUAD_GANTRY_LEVEL]
description: |
  Enhanced quad gantry leveling with conditional high-clearance first pass.
  - If QGL has not yet been applied, performs an initial leveling with increased Z height.
  - Then runs the standard leveling pass for refinement.
  - Safely saves/restores motion state to preserve G-code context.
  - High-pass lift height is configurable via _print_settings.variable_qgl_lift.

rename_existing: _QUAD_GANTRY_LEVEL

gcode:
  # === Load optional lift height from shared print settings ===
  {% set ps = printer["gcode_macro _print_settings"] %}
  {% set lift = ps.variable_qgl_lift|default(8.0)|float %}

  # === Save motion and coordinate state before QGL ===
  SAVE_GCODE_STATE NAME=STATE_QGL

  # === Clear mesh to ensure QGL operates without interference ===
  BED_MESH_CLEAR

  # === First pass: Only run coarse alignment at higher Z if not already applied ===
  {% if not printer.quad_gantry_level.applied %}
    _QUAD_GANTRY_LEVEL horizontal_move_z={lift} retry_tolerance=1
  {% endif %}

  # === Second pass: Always run full leveling with default settings ===
  _QUAD_GANTRY_LEVEL

  # === Restore saved motion state after leveling ===
  RESTORE_GCODE_STATE NAME=STATE_QGL

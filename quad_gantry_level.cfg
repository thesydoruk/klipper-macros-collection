[gcode_macro QUAD_GANTRY_LEVEL]
description: Conditional quad gantry leveling. Uses internal _QUAD_GANTRY_LEVEL only for Eddy probes. Defaults to standard QGL otherwise.

rename_existing: _QUAD_GANTRY_LEVEL

gcode:
  # === Detect Eddy probe system ===
  {% set is_eddy = printer.configfile.config|dictsort|map(attribute=0)|select("match", "^probe_eddy_")|list|length > 0 %}

  {% if is_eddy %}
    # === Load user-defined high-pass Z move from _print_settings ===
    {% set ps = printer["gcode_macro _print_settings"] %}
    {% set lift = ps.variable_qgl_lift|default(8.0)|float %}

    # === Save motion state before QGL ===
    SAVE_GCODE_STATE NAME=STATE_QGL
    BED_MESH_CLEAR

    # === First pass: coarse alignment if needed ===
    {% if not printer.quad_gantry_level.applied %}
      _QUAD_GANTRY_LEVEL horizontal_move_z={lift} retry_tolerance=1
    {% endif %}

    # === Second pass: final leveling with config-specified height ===
    _QUAD_GANTRY_LEVEL

    # === Restore previous G-code state ===
    RESTORE_GCODE_STATE NAME=STATE_QGL
  {% else %}
    # === Non-Eddy case: use standard QGL ===
    QUAD_GANTRY_LEVEL
  {% endif %}

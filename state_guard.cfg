; state_guard.cfg
; Global printer state tracking and wrappers around core print-control macros.
; Tracks the current high-level state of the printer and exposes it as:
;   [gcode_macro GLOBAL_STATE].status  -> "idle", "printing", "paused", "canceled"
;   [gcode_macro GLOBAL_STATE].last_job -> last known job name (if slicer passes one).
;
; This file also wraps PRINT_START, PRINT_END, PAUSE, RESUME and CANCEL_PRINT
; so that the GLOBAL_STATE is always in sync with the real print lifecycle.

[gcode_macro GLOBAL_STATE]
description: |
  Stores the global high-level printer state and the last known job name.
  This macro can be called manually to inspect current values.
variable_status: "idle"        # "idle", "printing", "paused", "canceled"
variable_last_job: ""          # Last known job name (optional, set by PRINT_START wrapper)
gcode:
    RESPOND TYPE=echo MSG="GLOBAL_STATE: status={status}, last_job='{last_job}'"

[gcode_macro _SET_GLOBAL_STATE]
description: Helper macro to update GLOBAL_STATE.status and GLOBAL_STATE.last_job.
gcode:
    {% set new_status = params.STATUS|default("idle")|string %}
    {% set current = printer["gcode_macro GLOBAL_STATE"] %}
    {% set new_job = params.JOB|default(current.last_job)|string %}
    SET_GCODE_VARIABLE MACRO=GLOBAL_STATE VARIABLE=status VALUE="'{{ new_status }}'"
    SET_GCODE_VARIABLE MACRO=GLOBAL_STATE VARIABLE=last_job VALUE="'{{ new_job }}'"
    RESPOND TYPE=echo MSG="GLOBAL_STATE: status='{new_status}', last_job='{{ new_job }}'"

; ---------------------------------------------------------------------------
; Wrapper around PRINT_START
; ---------------------------------------------------------------------------

[gcode_macro PRINT_START]
description: |
  Wrapper around the user-defined PRINT_START.
  Updates GLOBAL_STATE to 'printing' and forwards all parameters.
rename_existing: _USER_PRINT_START
gcode:
    ; Many slicers pass a job name as JOB_NAME; this line is safe even if they do not.
    {% set job_name = params.JOB_NAME|default("")|string %}
    _SET_GLOBAL_STATE STATUS="printing" JOB="{{ job_name }}"
    _USER_PRINT_START {rawparams}

; ---------------------------------------------------------------------------
; Wrapper around PRINT_END
; ---------------------------------------------------------------------------

[gcode_macro PRINT_END]
description: |
  Wrapper around the user-defined PRINT_END.
  Sets GLOBAL_STATE back to 'idle' and forwards all parameters.
rename_existing: _USER_PRINT_END
gcode:
    _SET_GLOBAL_STATE STATUS="idle"
    _USER_PRINT_END {rawparams}

; ---------------------------------------------------------------------------
; Wrapper around PAUSE
; ---------------------------------------------------------------------------

[gcode_macro PAUSE]
description: |
  Wrapper around the existing PAUSE implementation.
  Sets GLOBAL_STATE to 'paused' and then calls the original PAUSE.
rename_existing: _USER_PAUSE
gcode:
    _SET_GLOBAL_STATE STATUS="paused"
    _USER_PAUSE {rawparams}

; ---------------------------------------------------------------------------
; Wrapper around RESUME
; ---------------------------------------------------------------------------

[gcode_macro RESUME]
description: |
  Wrapper around the existing RESUME implementation.
  Sets GLOBAL_STATE back to 'printing' and then calls the original RESUME.
rename_existing: _USER_RESUME
gcode:
    _SET_GLOBAL_STATE STATUS="printing"
    _USER_RESUME {rawparams}

; ---------------------------------------------------------------------------
; Wrapper around CANCEL_PRINT
; ---------------------------------------------------------------------------

[gcode_macro CANCEL_PRINT]
description: |
  Wrapper around the existing CANCEL_PRINT implementation.
  Sets GLOBAL_STATE to 'canceled' and then calls the original CANCEL_PRINT.
  Depending on the user macros, PRINT_END may later switch the state to 'idle'.
rename_existing: _USER_CANCEL_PRINT
gcode:
    _SET_GLOBAL_STATE STATUS="canceled"
    _USER_CANCEL_PRINT {rawparams}

; ---------------------------------------------------------------------------
; Helper for state checks inside user macros
; ---------------------------------------------------------------------------

[gcode_macro STATE_REQUIRE]
description: |
  Helper macro that reports an error if the current GLOBAL_STATE.status
  is not one of the allowed values. This macro does not automatically
  stop execution of the caller, so the caller must wrap its body in a
  conditional block based on GLOBAL_STATE.status.
  Usage inside another macro:
    {% set status = printer["gcode_macro GLOBAL_STATE"].status %}
    {% if status == "idle" %}
        ; safe body
    {% else %}
        RESPOND TYPE=error MSG="This macro can only run when idle"
    {% endif %}
gcode:
    {% set allowed_string = params.ALLOWED|default("idle,paused")|string|lower %}
    {% set allowed = allowed_string|replace(" ", "")|split(",") %}
    {% set current = printer["gcode_macro GLOBAL_STATE"].status|string|lower %}
    {% if current not in allowed %}
        RESPOND TYPE=error MSG="STATE_REQUIRE: Command not allowed while status='{{ current }}'. Allowed: {{ allowed }}"
    {% endif %}

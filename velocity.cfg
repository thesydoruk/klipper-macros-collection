; Marlin-style velocity / pressure-advance helpers (inspired by imported km velocity.cfg).
; Calls SET_VELOCITY_LIMIT (respects lock_accel.cfg when included before this file).
; Public: M201, M203, M205, M900, RESET_VELOCITY_LIMITS
; _macro_globals.variable_pressure_advance_scale: >0 scales M900 K=; <=0 disables M900.

[gcode_macro M201]
description: |
  Marlin M201 — set acceleration from X/Y (uses min of given axes, mm/s²).
  With no X/Y, forwards bare SET_VELOCITY_LIMIT (Klipper reports current limits).
gcode:
  {% if 'X' in params or 'Y' in params %}
    {% set vx = params.X|default(params.Y)|float %}
    {% set vy = params.Y|default(params.X)|float %}
    {% set accel = [vx, vy]|min %}
    SET_VELOCITY_LIMIT ACCEL={accel|int}
  {% else %}
    SET_VELOCITY_LIMIT
  {% endif %}

[gcode_macro M203]
description: |
  Marlin M203 — set max velocity from X/Y (min of values, mm/s).
  With no X/Y, forwards bare SET_VELOCITY_LIMIT.
gcode:
  {% if 'X' in params or 'Y' in params %}
    {% set vx = params.X|default(params.Y)|float %}
    {% set vy = params.Y|default(params.X)|float %}
    {% set velocity = [vx, vy]|min %}
    SET_VELOCITY_LIMIT VELOCITY={velocity}
  {% else %}
    SET_VELOCITY_LIMIT
  {% endif %}

[gcode_macro M205]
description: |
  Maps X/Y to SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY (min of X,Y), matching km-style slicer output.
  With no X/Y, forwards bare SET_VELOCITY_LIMIT.
gcode:
  {% if 'X' in params or 'Y' in params %}
    {% set vx = params.X|default(0)|float %}
    {% set vy = params.Y|default(0)|float %}
    {% set scv = [vx, vy]|min %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={scv}
  {% else %}
    SET_VELOCITY_LIMIT
  {% endif %}

[gcode_macro M900]
description: |
  Marlin M900 — SET_PRESSURE_ADVANCE. K= value; T= extruder index (0 = extruder, 1 = extruder1, …).
  Disabled when variable_pressure_advance_scale <= 0. Otherwise ADVANCE = K * scale.
gcode:
  {% set g = printer["gcode_macro _macro_globals"] %}
  {% set scale = g.variable_pressure_advance_scale|float %}
  {% if scale > 0.0 %}
    {% if 'T' in params %}
      {% set ti = params.T|int %}
      {% set extruder = "extruder" if ti == 0 else ("extruder" ~ ti) %}
    {% else %}
      {% set extruder = printer.toolhead.extruder %}
    {% endif %}
    {% if 'K' in params %}
      {% set adv = params.K|float * scale %}
      SET_PRESSURE_ADVANCE EXTRUDER={extruder} ADVANCE={adv}
    {% endif %}
  {% endif %}

[gcode_macro RESET_VELOCITY_LIMITS]
description: |
  Set ACCEL back to printer.cfg [printer] max_accel (via SET_VELOCITY_LIMIT). Use after slicer M201/M204 sequences if needed.
gcode:
  {% set max_a = printer.configfile.settings.printer.max_accel|int %}
  SET_VELOCITY_LIMIT ACCEL={max_a}

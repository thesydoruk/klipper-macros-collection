; Filament load / unload inspired by klipper-macros (jschuh) but standalone:
; uses _macro_globals only — no _km_globals, PARK, or resume.saved_e coupling.

[gcode_macro _filament_load_unload]
description: Internal helper. Use LOAD_FILAMENT or UNLOAD_FILAMENT.
gcode:
  {% set g = printer["gcode_macro _macro_globals"] %}
  {% set saved_extruder = printer.toolhead.extruder %}
  {% set EXTRUDER = params.EXTRUDER|default(saved_extruder)|lower %}
  {% set min_cfg = printer.configfile.settings[EXTRUDER].min_extrude_temp|float %}
  {% set default_min = min_cfg + g.variable_filament_min_temp_offset|float %}
  {% if 'MINIMUM' in params %}
    {% set MINIMUM = params.MINIMUM|float %}
  {% elif printer[EXTRUDER].target > default_min %}
    {% set MINIMUM = printer[EXTRUDER].target %}
  {% else %}
    {% set MINIMUM = default_min %}
  {% endif %}
  {% if MINIMUM < min_cfg %}
    {action_raise_error("Filament: MINIMUM below min_extrude_temp for this extruder")}
  {% endif %}

  {% set SPEED = params.SPEED|default(g.variable_filament_load_speed)|int %}
  {% set priming_length = g.variable_filament_load_priming_length|float %}
  {% set LENGTH = params.LENGTH|default(g.variable_filament_load_length)|float - priming_length %}
  {% if LENGTH < 0 %}
    {% set priming_length = (priming_length + LENGTH, 0)|max %}
    {% set LENGTH = 0 %}
  {% endif %}

  SAVE_GCODE_STATE NAME=_FILAMENT_LOAD_UNLOAD
  {% if EXTRUDER != saved_extruder %}
    ACTIVATE_EXTRUDER EXTRUDER={EXTRUDER}
  {% endif %}

  {% if not printer.extruder.can_extrude or printer[EXTRUDER].target < default_min %}
    RESPOND TYPE=echo MSG="Filament: preheating {EXTRUDER} to {MINIMUM|int}C"
    M109 S{MINIMUM|int}
  {% endif %}

  M83
  {% set priming_speed = [g.variable_filament_priming_speed|int, SPEED]|min %}
  {% if params.LOAD|int %}
    G1 E{LENGTH} F{SPEED}
    G1 E{priming_length} F{priming_speed}
  {% else %}
    {% set pre_prime = g.variable_filament_unload_pre_prime|float %}
    {% set shaping_moves = g.variable_filament_unload_shaping_moves|int %}
    {% set shaping_distance = (shaping_moves * (1 + shaping_moves) / 20.0)|float %}
    G1 E{pre_prime} F{SPEED}
    G4 P500
    G1 E{-(priming_length - shaping_distance)} F{SPEED}
    {% for i in range(1, shaping_moves + 1) %}
      G1 E2 F{priming_speed}
      G1 E{-(2 + 0.1 * i)} F{priming_speed}
    {% endfor %}
    G1 E{-(LENGTH + pre_prime)} F{SPEED}
  {% endif %}

  RESTORE_GCODE_STATE NAME=_FILAMENT_LOAD_UNLOAD

  {% set beeps = params.BEEPS|default(g.variable_filament_beep_count)|int %}
  {% if beeps > 0 %}
    {% for _ in range(beeps) %}
      M300 S880 P120
      G4 P180
    {% endfor %}
  {% endif %}

[gcode_macro LOAD_FILAMENT]
description: |
  Load filament into the active (or selected) extruder. Preheats to MINIMUM or
  min_extrude_temp + offset if needed. Params: LENGTH, SPEED, EXTRUDER, MINIMUM, BEEPS.
gcode:
  _FILAMENT_LOAD_UNLOAD LOAD=1 {rawparams}

[gcode_macro UNLOAD_FILAMENT]
description: |
  Unload filament (tip shaping + retract). Same params as LOAD_FILAMENT; LENGTH is
  total stock-removal budget in mm (see _macro_globals filament_load_length default).
gcode:
  _FILAMENT_LOAD_UNLOAD LOAD=0 {rawparams}

[gcode_macro _filament_pause_for_change]
description: Internal — PAUSE if SD print active, else small Z lift if homed.
gcode:
  {% set g = printer["gcode_macro _macro_globals"] %}
  {% if "T" in params %}
    {% set ti = params.T|int %}
    {% set extruder = "extruder" if ti == 0 else ("extruder" ~ ti) %}
  {% else %}
    {% set extruder = printer.toolhead.extruder %}
  {% endif %}
  {% if extruder != printer.toolhead.extruder %}
    ACTIVATE_EXTRUDER EXTRUDER={extruder}
  {% endif %}

  {% if printer.idle_timeout.state|string == "Printing" or (printer.virtual_sdcard|default({})).is_active|default(False) %}
    PAUSE
  {% elif not printer.pause_resume.is_paused %}
    {% set lift = g.variable_filament_idle_lift_z|float %}
    {% if lift > 0 and printer.toolhead.homed_axes|lower == "xyz" %}
      G91
      G1 Z{lift} F{g.variable_filament_idle_lift_feedrate|int}
      G90
    {% endif %}
  {% endif %}

[gcode_macro M701]
description: |
  Marlin-style load: pause print (or idle Z-lift), then LOAD_FILAMENT.
  L=length (mm). T=extruder index. U is accepted as alias for L if L missing.
gcode:
  {% if "U" in params %}
    {% if "L" not in params %}
      RESPOND TYPE=echo MSG="M701: using U as L (length)"
      {% set dummy = params.__setitem__("L", params.U) %}
    {% else %}
      RESPOND TYPE=echo MSG="M701: ignoring U (L already set)"
    {% endif %}
  {% endif %}
  {% set g = printer["gcode_macro _macro_globals"] %}
  _FILAMENT_PAUSE_FOR_CHANGE {% for k in params %}{% if k|upper != "L" and k|upper != "U" %} {k}={params[k]}{% endif %}{% endfor %}
  {% set L = params.L|default(g.variable_filament_load_length)|float %}
  LOAD_FILAMENT LENGTH={L} BEEPS={params.BEEPS|default(g.variable_filament_beep_count)|int}{% if "SPEED" in params %} SPEED={params.SPEED}{% endif %}{% if "MINIMUM" in params %} MINIMUM={params.MINIMUM}{% endif %}{% if "EXTRUDER" in params %} EXTRUDER={params.EXTRUDER}{% endif %}

[gcode_macro M702]
description: |
  Marlin-style unload: pause or idle Z-lift, then UNLOAD_FILAMENT.
  U=unload length (mm). L accepted as alias for U if U missing.
gcode:
  {% if "L" in params %}
    {% if "U" not in params %}
      RESPOND TYPE=echo MSG="M702: using L as U (length)"
      {% set dummy = params.__setitem__("U", params.L) %}
    {% else %}
      RESPOND TYPE=echo MSG="M702: ignoring L (U already set)"
    {% endif %}
  {% endif %}
  {% set g = printer["gcode_macro _macro_globals"] %}
  _FILAMENT_PAUSE_FOR_CHANGE {% for k in params %}{% if k|upper != "L" and k|upper != "U" %} {k}={params[k]}{% endif %}{% endfor %}
  {% set U = params.U|default(g.variable_filament_load_length)|float %}
  UNLOAD_FILAMENT LENGTH={U} BEEPS={params.BEEPS|default(g.variable_filament_beep_count)|int}{% if "SPEED" in params %} SPEED={params.SPEED}{% endif %}{% if "MINIMUM" in params %} MINIMUM={params.MINIMUM}{% endif %}{% if "EXTRUDER" in params %} EXTRUDER={params.EXTRUDER}{% endif %}

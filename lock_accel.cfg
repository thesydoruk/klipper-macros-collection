[gcode_macro ACCEL_LOCK_STATE]
description: |
  Macro that maintains the global lock state for acceleration changes.
  If `locked` is `True`, all acceleration modifications (via M204 or SET_VELOCITY_LIMIT)
  will be ignored unless explicitly overridden.

variables:
  variable_locked: False

gcode:
  RESPOND TYPE=echo MSG="ACCEL LOCKED = %s" % (locked,)


[gcode_macro LOCK_ACCEL]
description: |
  Lock acceleration changes to ensure consistent motion behavior during a print.
  You can optionally provide a new acceleration value via `S` or `ACCEL`.
  After this, any attempts to change acceleration (via M204 or SET_VELOCITY_LIMIT)
  will be blocked until `UNLOCK_ACCEL` is called.

  Parameters:
    S / ACCEL: (optional) acceleration value to apply before locking

gcode:
  {% set accel = params.S|default(params.ACCEL, none) %}
  {% if accel is not none %}
    SET_VELOCITY_LIMIT ACCEL={accel}
    RESPOND TYPE=echo MSG="ACCEL LOCKED at ACCEL=%s" % (accel,)
  {% else %}
    RESPOND TYPE=echo MSG="ACCEL LOCKED (no new value set)"
  {% endif %}
  SET_GCODE_VARIABLE MACRO=ACCEL_LOCK_STATE VARIABLE=locked VALUE=True


[gcode_macro UNLOCK_ACCEL]
description: |
  Unlocks acceleration changes, restoring normal behavior.
  After calling this, M204 and SET_VELOCITY_LIMIT will function normally.

gcode:
  SET_GCODE_VARIABLE MACRO=ACCEL_LOCK_STATE VARIABLE=locked VALUE=False
  RESPOND TYPE=echo MSG="Acceleration changes are now UNLOCKED"


[gcode_macro M204]
description: |
  Overrides the standard M204 command.
  If acceleration lock is active, the `S` parameter will be ignored.
  This ensures that prints maintain a consistent acceleration profile.

rename_existing: true

gcode:
  {% set is_locked = printer["gcode_macro ACCEL_LOCK_STATE"].locked %}
  {% set accel = params.S|default(0)|int %}
  {% if is_locked %}
    RESPOND TYPE=echo MSG="M204 S%s IGNORED: ACCEL LOCKED" % (accel,)
  {% else %}
    SET_VELOCITY_LIMIT ACCEL={accel}
    RESPOND TYPE=echo MSG="M204 S%s applied" % (accel,)
  {% endif %}


[gcode_macro SET_VELOCITY_LIMIT]
description: |
  Overrides the built-in SET_VELOCITY_LIMIT command.
  If acceleration lock is active, the `ACCEL` field will be ignored.
  Other parameters (e.g. VELOCITY, ACCEL_TO_DECEL) are still applied normally.

rename_existing: true

gcode:
  {% set is_locked = printer["gcode_macro ACCEL_LOCK_STATE"].locked %}
  {% set args = [] %}

  {% for k, v in params.items() %}
    {% if k|upper == "ACCEL" and is_locked %}
      RESPOND TYPE=echo MSG="SET_VELOCITY_LIMIT ACCEL=%s IGNORED: ACCEL LOCKED" % (v,)
    {% else %}
      {% set _ = args.append(k ~ '=' ~ v) %}
    {% endif %}
  {% endfor %}

  {% if args|length > 0 %}
    SET_VELOCITY_LIMIT {{ args|join(" ") }}
  {% else %}
    RESPOND TYPE=echo MSG="SET_VELOCITY_LIMIT: all parameters blocked or missing"
  {% endif %}

# lock_accel.cfg — optional acceleration write-lock around SET_VELOCITY_LIMIT.
# Public: LOCK_ACCEL, UNLOCK_ACCEL. Use when slicer or macros must not raise ACCEL.

[gcode_macro ACCEL_LOCK_STATE]
description: |
  Stores whether acceleration (ACCEL) changes are locked.
  Used internally by other macros to check ACCEL write protection status.
variable_accel_locked: False
gcode:
    RESPOND TYPE=echo MSG="ACCEL LOCKED = {accel_locked}"

[gcode_macro LOCK_ACCEL]
description: |
  Locks acceleration changes and optionally sets ACCEL immediately.
  ACCEL above printer.max_accel is only allowed with FORCE=1.
  Parameters:
    ACCEL=<value> or S=<value> — acceleration to set and lock (optional)
    FORCE=1 — allow exceeding max_accel
gcode:
    {% if 'S' in params %}
      {% set accel = params.S %}
    {% elif 'ACCEL' in params %}
      {% set accel = params.ACCEL %}
    {% else %}
      {% set accel = none %}
    {% endif %}
    {% set max_accel = printer.configfile.settings.printer.max_accel|int %}
    {% set force = params.FORCE|default(0)|int %}
    {% if accel is not none %}
        {% set accel_val = accel|int %}
        {% if accel_val > max_accel and force != 1 %}
            SET_VELOCITY_LIMIT ACCEL={max_accel}
            RESPOND TYPE=echo MSG="LOCK_ACCEL: ACCEL={accel_val} clamped to max_accel={max_accel} (no FORCE)"
        {% else %}
            SET_VELOCITY_LIMIT ACCEL={accel_val}
            {% if accel_val > max_accel %}
                RESPOND TYPE=echo MSG="LOCK_ACCEL: ACCEL={accel_val} allowed via FORCE"
            {% else %}
                RESPOND TYPE=echo MSG="LOCK_ACCEL: ACCEL={accel_val} set"
            {% endif %}
        {% endif %}
    {% else %}
        RESPOND TYPE=echo MSG="ACCEL locked (no value set)"
    {% endif %}
    SET_GCODE_VARIABLE MACRO=ACCEL_LOCK_STATE VARIABLE=accel_locked VALUE=True

[gcode_macro UNLOCK_ACCEL]
description: |
  Unlocks ACCEL, allowing acceleration changes again.
gcode:
    SET_GCODE_VARIABLE MACRO=ACCEL_LOCK_STATE VARIABLE=accel_locked VALUE=False
    RESPOND TYPE=echo MSG="Acceleration changes are now UNLOCKED"

[gcode_macro SET_VELOCITY_LIMIT]
description: |
  Intercepts SET_VELOCITY_LIMIT commands to enforce max_accel limits
  and respect the ACCEL lock state.
rename_existing: _SET_VELOCITY_LIMIT
gcode:
    {% set accel_locked = printer["gcode_macro ACCEL_LOCK_STATE"].accel_locked %}
    {% set max_accel = printer.configfile.settings.printer.max_accel|int %}

    {% set paramlist = [] %}
    {% for k, v in params.items() %}
        {% set _ = paramlist.append([k.upper(), v]) %}
    {% endfor %}

    {% set force = False %}
    {% for p in paramlist %}
        {% if p[0] == 'FORCE' and p[1]|int == 1 %}
            {% set force = True %}
        {% endif %}
    {% endfor %}

    {% set new_args = [] %}
    {% for p in paramlist %}
        {% set key = p[0] %}
        {% set val = p[1] %}
        {% if key == 'ACCEL' %}
            {% set accel_val = val|int %}
            {% if not accel_locked %}
                {% if accel_val > max_accel and not force %}
                    {% set _ = new_args.append(key ~ '=' ~ max_accel) %}
                {% else %}
                    {% set _ = new_args.append(key ~ '=' ~ accel_val) %}
                {% endif %}
            {% endif %}
        {% elif key != 'FORCE' %}
            {% set _ = new_args.append(key ~ '=' ~ val) %}
        {% endif %}
    {% endfor %}

    {% set args_str = new_args|join(' ') %}
    {% if args_str %}
        _SET_VELOCITY_LIMIT {args_str}
    {% endif %}

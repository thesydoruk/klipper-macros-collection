[gcode_macro ACCEL_LOCK_STATE]
description: |
  Stores whether acceleration (ACCEL) changes are locked.
  Used internally by other macros to check ACCEL write protection status.
variable_locked: False
gcode:
    RESPOND TYPE=echo MSG="ACCEL LOCKED = {locked}"

[gcode_macro LOCK_ACCEL]
description: |
  Locks acceleration changes and optionally sets ACCEL immediately.
  ACCEL above printer.max_accel is only allowed with FORCE=1.
  Parameters:
    ACCEL=<value> or S=<value> — acceleration to set and lock (optional)
    FORCE=1 — allow exceeding max_accel
gcode:
    {% set accel = params.S|default(params.ACCEL, none) %}
    {% set max_accel = printer.configfile.settings.printer.max_accel|int %}
    {% set force = params.FORCE|default(0)|int %}
    {% if accel is not none %}
        {% set accel_val = accel|int %}
        {% if accel_val > max_accel and force != 1 %}
            SET_VELOCITY_LIMIT ACCEL={max_accel}
            RESPOND TYPE=echo MSG="LOCK_ACCEL: ACCEL={accel_val} clamped to max_accel={max_accel} (no FORCE)"
        {% else %}
            SET_VELOCITY_LIMIT ACCEL={accel_val}
            {% if accel_val > max_accel %}
                RESPOND TYPE=echo MSG="LOCK_ACCEL: ACCEL={accel_val} allowed via FORCE"
            {% else %}
                RESPOND TYPE=echo MSG="LOCK_ACCEL: ACCEL={accel_val} set"
            {% endif %}
        {% endif %}
    {% else %}
        RESPOND TYPE=echo MSG="ACCEL locked (no value set)"
    {% endif %}
    SET_GCODE_VARIABLE MACRO=ACCEL_LOCK_STATE VARIABLE=locked VALUE=True

[gcode_macro UNLOCK_ACCEL]
description: |
  Unlocks ACCEL, allowing acceleration changes again.
gcode:
    SET_GCODE_VARIABLE MACRO=ACCEL_LOCK_STATE VARIABLE=locked VALUE=False
    RESPOND TYPE=echo MSG="Acceleration changes are now UNLOCKED"

[gcode_macro SET_VELOCITY_LIMIT]
description: |
  Intercepts SET_VELOCITY_LIMIT and controls ACCEL changes.
  - If ACCEL is locked: ignored
  - If ACCEL > max_accel: clamped unless FORCE=1
  All other parameters are passed through.
rename_existing: _SET_VELOCITY_LIMIT
gcode:
    {% set is_locked = printer["gcode_macro ACCEL_LOCK_STATE"].locked %}
    {% set max_accel = printer.configfile.settings.printer.max_accel|int %}
    {% set force = params.FORCE|default(0)|int %}
    {% set has_accel = "ACCEL" in params or "accel" in params %}
    {% if has_accel %}
        {% set accel = (params.ACCEL if "ACCEL" in params else params.accel)|int %}
        {% if is_locked %}
            RESPOND TYPE=echo MSG="SET_VELOCITY_LIMIT ACCEL={accel} IGNORED: ACCEL LOCKED"
        {% elif accel > max_accel and force != 1 %}
            _SET_VELOCITY_LIMIT ACCEL={max_accel}
            RESPOND TYPE=echo MSG="SET_VELOCITY_LIMIT: ACCEL={accel} clamped to max_accel={max_accel} (no FORCE)"
        {% else %}
            _SET_VELOCITY_LIMIT ACCEL={accel}
            {% if accel > max_accel %}
                RESPOND TYPE=echo MSG="SET_VELOCITY_LIMIT: ACCEL={accel} allowed via FORCE"
            {% else %}
                RESPOND TYPE=echo MSG="SET_VELOCITY_LIMIT: ACCEL={accel} applied"
            {% endif %}
        {% endif %}
    {% else %}
        _SET_VELOCITY_LIMIT {% for k, v in params.items() if k|upper != "FORCE" %}{k}={v} {% endfor %}
        RESPOND TYPE=echo MSG="SET_VELOCITY_LIMIT: applied (ACCEL not changed)"
    {% endif %}

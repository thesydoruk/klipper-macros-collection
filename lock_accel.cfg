[gcode_macro ACCEL_LOCK_STATE]
description: |
  Tracks whether acceleration changes are currently locked.
  Used internally by macros to enforce ACCEL write protection.
variable_locked: False
gcode:
    RESPOND TYPE=echo MSG="🔐 ACCEL LOCKED = %s" % (locked,)


[gcode_macro LOCK_ACCEL]
description: |
  Locks acceleration changes and optionally sets ACCEL.
  ACCEL above printer.max_accel is allowed only with FORCE=1.
  Parameters:
    ACCEL=<value> or S=<value> — acceleration to set and lock
    FORCE=1 (optional)         — bypasses max_accel limit
gcode:
    {% set accel = params.S|default(params.ACCEL, none) %}
    {% set max_accel = printer.configfile.settings.printer.max_accel|int %}
    {% set force = params.FORCE|default(0)|int %}

    {% if accel is not none %}
        {% set accel_val = accel|int %}
        {% if accel_val > max_accel and force != 1 %}
            RESPOND TYPE=echo MSG="⚠️ LOCK_ACCEL ACCEL=%s clamped to max_accel=%s (no FORCE)" % (accel_val, max_accel)
            SET_VELOCITY_LIMIT ACCEL={max_accel}
        {% else %}
            SET_VELOCITY_LIMIT ACCEL={accel_val}
            {% if accel_val > max_accel %}
                RESPOND TYPE=echo MSG="✅ LOCK_ACCEL ACCEL=%s allowed via FORCE" % (accel_val,)
            {% else %}
                RESPOND TYPE=echo MSG="✅ LOCK_ACCEL ACCEL=%s set" % (accel_val,)
            {% endif %}
        {% endif %}
    {% else %}
        RESPOND TYPE=echo MSG="🔒 ACCEL LOCKED (no new value set)"
    {% endif %}

    SET_GCODE_VARIABLE MACRO=ACCEL_LOCK_STATE VARIABLE=locked VALUE=True


[gcode_macro UNLOCK_ACCEL]
description: |
  Unlocks acceleration changes, restoring normal behavior.
gcode:
    SET_GCODE_VARIABLE MACRO=ACCEL_LOCK_STATE VARIABLE=locked VALUE=False
    RESPOND TYPE=echo MSG="🔓 Acceleration changes are now UNLOCKED"


[gcode_macro M204]
description: |
  Overrides the default M204 to block or clamp ACCEL changes.
  Behavior:
    - If ACCEL is locked → ignored
    - If ACCEL > max_accel → ignored
    - Else → allowed
rename_existing: M204
gcode:
    {% set is_locked = printer["gcode_macro ACCEL_LOCK_STATE"].locked %}
    {% set accel = params.S|default(0)|int %}
    {% set max_accel = printer.configfile.settings.printer.max_accel|int %}

    {% if is_locked %}
        RESPOND TYPE=echo MSG="🚫 M204 S%s IGNORED: ACCEL LOCKED" % (accel,)
    {% elif accel > max_accel %}
        RESPOND TYPE=echo MSG="⚠️ M204 S%s IGNORED: exceeds max_accel=%s" % (accel, max_accel)
    {% else %}
        SET_VELOCITY_LIMIT ACCEL={accel}
        RESPOND TYPE=echo MSG="✅ M204 S%s applied" % (accel,)
    {% endif %}


[gcode_macro SET_VELOCITY_LIMIT]
description: |
  Overrides the built-in SET_VELOCITY_LIMIT command.
  Filters ACCEL if:
    - ACCEL is locked → ignored
    - ACCEL > max_accel → clamped unless FORCE=1
  Other parameters pass through unchanged.
  Parameters:
    ACCEL=<value> — acceleration limit
    FORCE=1       — optional override of max_accel
rename_existing: SET_VELOCITY_LIMIT
gcode:
    {% set is_locked = printer["gcode_macro ACCEL_LOCK_STATE"].locked %}
    {% set max_accel = printer.configfile.settings.printer.max_accel|int %}
    {% set force = params.FORCE|default(0)|int %}
    {% set args = [] %}

    {% for k, v in params.items() %}
        {% set key_upper = k|upper %}
        {% if key_upper == "ACCEL" %}
            {% set accel = v|int %}
            {% if is_locked %}
                RESPOND TYPE=echo MSG="🚫 SET_VELOCITY_LIMIT ACCEL=%s IGNORED: ACCEL LOCKED" % (accel,)
            {% elif accel > max_accel and force != 1 %}
                RESPOND TYPE=echo MSG="⚠️ SET_VELOCITY_LIMIT ACCEL=%s clamped to max_accel=%s (no FORCE)" % (accel, max_accel)
                {% set _ = args.append(k ~ '=' ~ max_accel) %}
            {% else %}
                {% set _ = args.append(k ~ '=' ~ accel) %}
                {% if accel > max_accel %}
                    RESPOND TYPE=echo MSG="✅ SET_VELOCITY_LIMIT ACCEL=%s allowed via FORCE" % (accel,)
                {% else %}
                    RESPOND TYPE=echo MSG="✅ SET_VELOCITY_LIMIT ACCEL=%s applied" % (accel,)
                {% endif %}
            {% endif %}
        {% elif key_upper != "FORCE" %}
            {% set _ = args.append(k ~ '=' ~ v) %}
        {% endif %}
    {% endfor %}

    {% if args|length > 0 %}
        SET_VELOCITY_LIMIT {% for a in args %}{{ a }} {% endfor %}
    {% else %}
        RESPOND TYPE=echo MSG="⚠️ SET_VELOCITY_LIMIT: all parameters blocked or missing"
    {% endif %}

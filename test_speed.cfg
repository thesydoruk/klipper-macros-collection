[gcode_macro TEST_SPEED]
description: |
  Test toolhead motion at high speed and acceleration to detect skipped steps.
  - Moves the head through large and small movement patterns.
  - Compares MCU-reported positions before and after test.
  - Restores all velocity limits and G-code state afterward.

  Parameters:
    SPEED: Motion speed in mm/s (default = printer.max_velocity)
    ACCEL: Acceleration in mm/s² (default = printer.max_accel)
    ITERATIONS: Number of test loops (default = 5)
    MIN_CRUISE_RATIO: Cruise ratio if supported (default = 0.5)
    BOUND: Safety margin from axis edges (default = 20)
    SMALLPATTERNSIZE: Size of inner test box (default = 20)

  Example:
    TEST_SPEED SPEED=250 ACCEL=4000 ITERATIONS=3

gcode:
  # === Read input parameters with safe fallbacks ===
  {% set speed = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
  {% set accel = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
  {% set iterations = params.ITERATIONS|default(5)|int %}
  {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(0.5)|float %}
  {% set bound = params.BOUND|default(20)|int %}
  {% set small = params.SMALLPATTERNSIZE|default(20)|int %}

  # === Define motion bounds based on printer size and margins ===
  {% set x_min = printer.toolhead.axis_minimum.x + bound %}
  {% set x_max = printer.toolhead.axis_maximum.x - bound %}
  {% set y_min = printer.toolhead.axis_minimum.y + bound %}
  {% set y_max = printer.toolhead.axis_maximum.y - bound %}
  {% set x_center = (printer.toolhead.axis_minimum.x + printer.toolhead.axis_maximum.x) / 2 %}
  {% set y_center = (printer.toolhead.axis_minimum.y + printer.toolhead.axis_maximum.y) / 2 %}
  {% set x_center_min = x_center - (small / 2) %}
  {% set x_center_max = x_center + (small / 2) %}
  {% set y_center_min = y_center - (small / 2) %}
  {% set y_center_max = y_center + (small / 2) %}

  # === Save current G-code mode and motion settings ===
  SAVE_GCODE_STATE NAME=TEST_SPEED

  { action_respond_info("TEST_SPEED: running %d iterations at %d mm/s, accel %d mm/s²" % (iterations, speed, accel)) }

  # === Home and prepare ===
  M400
  G28
  {% if printer.configfile.settings.quad_gantry_level and not printer.quad_gantry_level.applied %}
    QUAD_GANTRY_LEVEL
    G28 Z
  {% endif %}

  # === Move near max to help detect skipped steps visually ===
  G90
  G1 X{printer.toolhead.axis_maximum.x - 50} Y{printer.toolhead.axis_maximum.y - 50} F1800
  G28 X Y
  G0 X{printer.toolhead.axis_maximum.x - 1} Y{printer.toolhead.axis_maximum.y - 1} F1800
  G4 P1000

  # === Capture initial MCU-reported position ===
  RESPOND TYPE=command MSG="TEST_SPEED: capturing initial position"
  GET_POSITION
  {% set x0 = printer.toolhead.position.x %}
  {% set y0 = printer.toolhead.position.y %}
  {% set z0 = printer.toolhead.position.z %}

  # === Move to safe Z start ===
  G0 X{x_min} Y{y_min} Z{bound + 10} F{speed * 60}

  # === Apply custom velocity and acceleration limits ===
  {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={min_cruise_ratio}
  {% else %}
    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
  {% endif %}

  # === Run movement patterns ===
  {% for i in range(iterations) %}
    # Large diagonals
    G0 X{x_min} Y{y_min} F{speed * 60}
    G0 X{x_max} Y{y_max} F{speed * 60}
    G0 X{x_min} Y{y_min} F{speed * 60}
    G0 X{x_max} Y{y_min} F{speed * 60}
    G0 X{x_min} Y{y_max} F{speed * 60}
    G0 X{x_max} Y{y_min} F{speed * 60}

    # Large box
    G0 X{x_min} Y{y_min} F{speed * 60}
    G0 X{x_min} Y{y_max} F{speed * 60}
    G0 X{x_max} Y{y_max} F{speed * 60}
    G0 X{x_max} Y{y_min} F{speed * 60}

    # Small diagonals
    G0 X{x_center_min} Y{y_center_min} F{speed * 60}
    G0 X{x_center_max} Y{y_center_max} F{speed * 60}
    G0 X{x_center_min} Y{y_center_min} F{speed * 60}
    G0 X{x_center_max} Y{y_center_min} F{speed * 60}
    G0 X{x_center_min} Y{y_center_max} F{speed * 60}
    G0 X{x_center_max} Y{y_center_min} F{speed * 60}

    # Small box
    G0 X{x_center_min} Y{y_center_min} F{speed * 60}
    G0 X{x_center_min} Y{y_center_max} F{speed * 60}
    G0 X{x_center_max} Y{y_center_max} F{speed * 60}
    G0 X{x_center_max} Y{y_center_min} F{speed * 60}
  {% endfor %}

  # === Restore original velocity/accel settings ===
  {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio}
  {% else %}
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
  {% endif %}

  # === Final GET_POSITION and compare ===
  M400
  G28
  G90
  G0 X{printer.toolhead.axis_maximum.x - 1} Y{printer.toolhead.axis_maximum.y - 1} F1800
  G4 P1000

  GET_POSITION
  {% set x1 = printer.toolhead.position.x %}
  {% set y1 = printer.toolhead.position.y %}
  {% set z1 = printer.toolhead.position.z %}

  {% set dx = (x1 - x0)|round(3) %}
  {% set dy = (y1 - y0)|round(3) %}
  {% set dz = (z1 - z0)|round(3) %}

  RESPOND TYPE=info MSG="TEST_SPEED delta: ΔX={dx} ΔY={dy} ΔZ={dz}"

  # === Restore original G-code state ===
  RESTORE_GCODE_STATE NAME=TEST_SPEED

  M117 TEST COMPLETE

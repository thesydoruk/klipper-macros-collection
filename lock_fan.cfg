; lock_fan.cfg
; Macros that provide write protection for part cooling fan speed.
; This module adds:
;   - FAN_LOCK_STATE  — global storage for lock state and protected fan name
;   - LOCK_FAN        — enables locking of the configured fan speed
;   - UNLOCK_FAN      — disables locking
;   - Overrides for M106, M107 and SET_FAN_SPEED that respect the lock
;
; Typical usage:
;   - Set the part cooling fan to the desired speed once (for example with M106).
;   - Call LOCK_FAN to prevent any subsequent changes from slicer or manual G-code.
;   - Call UNLOCK_FAN when you want to allow changes again.

[gcode_macro FAN_LOCK_STATE]
description: |
  Stores whether the part cooling fan speed is locked.
  Used internally by the LOCK_FAN / UNLOCK_FAN macros and fan overrides.
variable_fan_locked: False                      # True when fan speed changes are blocked
variable_fan_name: "fan"                        # Name of the protected fan object (usually the default [fan])
gcode:
    RESPOND TYPE=echo MSG="FAN LOCKED = {fan_locked}, FAN NAME = {fan_name}"

[gcode_macro LOCK_FAN]
description: |
  Locks speed changes for the configured part cooling fan.
  Optionally sets the fan speed before locking.
  Usage examples:
    LOCK_FAN                     -> lock current speed
    LOCK_FAN SPEED=0.5           -> set 50% with SET_FAN_SPEED then lock
    LOCK_FAN S=200               -> set ~78% (200/255) then lock
gcode:
    {% set state = printer["gcode_macro FAN_LOCK_STATE"] %}
    {% set fan_name = state.fan_name %}

    # Optional speed parameter handling.
    # Supports:
    #   - SPEED=0.0..1.0 (Klipper SET_FAN_SPEED style)
    #   - S=0..255       (M106 style) which is converted to 0.0..1.0
    {% if 'SPEED' in params or 'S' in params %}
        {% if 'SPEED' in params %}
            {% set raw_speed = params.SPEED|float %}
        {% else %}
            {% set raw_speed = params.S|float %}
        {% endif %}

        {# If value > 1, assume 0–255 and convert to 0.0–1.0 #}
        {% if raw_speed > 1 %}
            {% set speed = raw_speed / 255.0 %}
        {% else %}
            {% set speed = raw_speed %}
        {% endif %}

        # Directly call the original SET_FAN_SPEED implementation
        # to avoid being blocked by the lock logic.
        _SET_FAN_SPEED_BASE FAN={fan_name} SPEED={speed}
    {% endif %}

    # Enable lock after the desired speed is set
    SET_GCODE_VARIABLE MACRO=FAN_LOCK_STATE VARIABLE=fan_locked VALUE=True
    RESPOND TYPE=echo MSG="FAN_LOCK: Fan speed locking ENABLED for fan '{fan_name}'"


[gcode_macro UNLOCK_FAN]
description: |
  Unlocks speed changes for the configured part cooling fan.
  After this, M106, M107 and SET_FAN_SPEED behave normally again.
gcode:
    SET_GCODE_VARIABLE MACRO=FAN_LOCK_STATE VARIABLE=fan_locked VALUE=False
    {% set state = printer["gcode_macro FAN_LOCK_STATE"] %}
    RESPOND TYPE=echo MSG="FAN_LOCK: Fan speed locking DISABLED for fan '{state.fan_name}'"

# ---------------------------------------------------------------------------
# Override M106 to respect the fan lock state
# ---------------------------------------------------------------------------

[gcode_macro M106]
description: |
  Overrides the built-in M106 command to respect the FAN_LOCK_STATE.
  When fan locking is enabled, M106 commands for the protected fan are ignored.
rename_existing: _M106_BASE
gcode:
    {% set state = printer["gcode_macro FAN_LOCK_STATE"] %}
    {% set fan_locked = state.fan_locked %}
    {% set fan_name = state.fan_name %}
    # M106 is commonly used for the primary part cooling fan.
    # If locking is enabled, block the command and emit a message.
    {% if fan_locked %}
        RESPOND TYPE=echo MSG="FAN_LOCK: Blocked M106 while fan '{fan_name}' speed is locked"
    {% else %}
        _M106_BASE {rawparams}
    {% endif %}

# ---------------------------------------------------------------------------
# Override M107 to respect the fan lock state
# ---------------------------------------------------------------------------

[gcode_macro M107]
description: |
  Overrides the built-in M107 command to respect the FAN_LOCK_STATE.
  When fan locking is enabled, M107 is ignored for the protected fan.
rename_existing: _M107_BASE
gcode:
    {% set state = printer["gcode_macro FAN_LOCK_STATE"] %}
    {% set fan_locked = state.fan_locked %}
    {% set fan_name = state.fan_name %}
    {% if fan_locked %}
        RESPOND TYPE=echo MSG="FAN_LOCK: Blocked M107 while fan '{fan_name}' speed is locked"
    {% else %}
        _M107_BASE
    {% endif %}

# ---------------------------------------------------------------------------
# Override SET_FAN_SPEED to respect the fan lock state
# ---------------------------------------------------------------------------

[gcode_macro SET_FAN_SPEED]
description: |
  Overrides the built-in SET_FAN_SPEED to respect the FAN_LOCK_STATE.
  Only commands that target the protected fan (FAN=<name> or default) are blocked.
rename_existing: _SET_FAN_SPEED_BASE
gcode:
    {% set state = printer["gcode_macro FAN_LOCK_STATE"] %}
    {% set fan_locked = state.fan_locked %}
    {% set target_fan = state.fan_name|string|lower %}
    {% set fan_param = (params.FAN|default(target_fan))|string|lower %}

    # If locking is enabled and this command targets the protected fan,
    # block the change and inform the user. Other fans are allowed.
    {% if fan_locked and fan_param == target_fan %}
        RESPOND TYPE=echo MSG="FAN_LOCK: Blocked SET_FAN_SPEED for fan '{fan_param}' while speed is locked"
    {% else %}
        _SET_FAN_SPEED_BASE {rawparams}
    {% endif %}

[gcode_macro Z_TILT_ADJUST]
description: |
  Enhanced Z tilt adjustment macro with conditional high-clearance first pass.
  - If Z_TILT has not yet been applied, it performs an initial alignment at a higher Z height.
  - Then, it runs the standard Z_TILT_ADJUST procedure to refine alignment.
  - Saves and restores motion state to ensure safe execution.
  - Lift height is configurable via _print_settings.variable_z_tilt_lift.

rename_existing: _Z_TILT_ADJUST

gcode:
  # === Load optional lift height from _print_settings ===
  {% set ps = printer["gcode_macro _print_settings"] %}
  {% set lift = ps.variable_z_tilt_lift|default(8)|float %}

  # === Save motion and coordinate state before adjustment ===
  SAVE_GCODE_STATE NAME=STATE_Z_TILT

  # === Clear any mesh to avoid interfering with gantry alignment ===
  BED_MESH_CLEAR

  # === First pass: Only run high-clearance tilt adjust if not yet applied ===
  {% if not printer.z_tilt.applied %}
    _Z_TILT_ADJUST horizontal_move_z={lift} retry_tolerance=1
  {% endif %}

  # === Second pass: Always run final refinement with default settings ===
  _Z_TILT_ADJUST

  # === Restore saved motion state (coordinates, feedrates, modes, etc) ===
  RESTORE_GCODE_STATE NAME=STATE_Z_TILT

[gcode_macro Z_TILT_ADJUST]
description: Conditional Z tilt adjustment macro. Uses _Z_TILT_ADJUST only for Eddy probes. Falls back to default otherwise.

rename_existing: _Z_TILT_ADJUST

gcode:
  # === Check if this is an Eddy probe system ===
  {% set is_eddy = printer.configfile.config|dictsort|map(attribute=0)|select("match", "^probe_eddy_")|list|length > 0 %}

  {% if is_eddy %}
    # === Load user-defined first Z lift from print_settings ===
    {% set ps = printer["gcode_macro _print_settings"] %}
    {% set lift = ps.variable_z_tilt_lift|default(8)|float %}

    # === Save state before custom tilt procedure ===
    SAVE_GCODE_STATE NAME=STATE_Z_TILT
    BED_MESH_CLEAR

    # === First pass: high clearance for unaligned bed ===
    {% if not printer.z_tilt.applied %}
      _Z_TILT_ADJUST horizontal_move_z={lift} retry_tolerance=1
    {% endif %}

    # === Second pass: refined adjustment with default config value ===
    _Z_TILT_ADJUST

    # === Restore previous motion state ===
    RESTORE_GCODE_STATE NAME=STATE_Z_TILT
  {% else %}
    # === Use default behavior if not an Eddy-based system ===
    Z_TILT_ADJUST
  {% endif %}

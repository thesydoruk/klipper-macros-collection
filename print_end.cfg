[gcode_macro PRINT_END]
description: Finalizes the print. Retracts, lifts, parks, resets motion limits,
  disables heaters, and optionally resets probe_eddy_ng state.

gcode:
  # === Load configuration values from shared macro ===
  {% set ps = printer["gcode_macro _print_settings"] %}
  {% set retract_e = ps.variable_end_retract_length|default(2.0)|float %}
  {% set lift_z = ps.variable_end_lift_z|default(10.0)|float %}
  {% set park_x_val = ps.variable_end_park_x|default("min") %}
  {% set park_y_val = ps.variable_end_park_y|default("max") %}

  # === Resolve parking coordinates based on config or user preference ===
  {% if park_x_val == "min" %}
    {% set park_x = printer.configfile.config["stepper_x"].position_min %}
  {% elif park_x_val == "max" %}
    {% set park_x = printer.configfile.config["stepper_x"].position_max %}
  {% else %}
    {% set park_x = park_x_val|float %}
  {% endif %}
  {% if park_y_val == "min" %}
    {% set park_y = printer.configfile.config["stepper_y"].position_min %}
  {% elif park_y_val == "max" %}
    {% set park_y = printer.configfile.config["stepper_y"].position_max %}
  {% else %}
    {% set park_y = park_y_val|float %}
  {% endif %}

  M117 Ending...
  M118 ===> PHASE RETRACT & LIFT

  # === Retract filament and lift the nozzle ===
  G91 ; Relative mode
  G1 E-{retract_e} F1800
  G1 Z{lift_z} F900
  G90 ; Back to absolute

  # === Park the toolhead at configured position ===
  M118 ===> PHASE PARK
  G1 X{park_x} Y{park_y} F6000

  # === Turn off heaters and fans ===
  M118 ===> PHASE COOLDOWN
  M104 S0
  M140 S0
  M106 S0

  # === Reset mesh and extrusion multipliers ===
  M118 ===> PHASE RESET
  BED_MESH_CLEAR
  M220 S100
  M221 S100

  # === Reset Eddy NG probe tap offset if used ===
  {% set has_probe_eddy_ng = printer.configfile.config|dictsort|map(attribute=0)|select("match", "^probe_eddy_ng ")|list|length > 0 %}
  {% if has_probe_eddy_ng %}
    PROBE_EDDY_NG_SET_TAP_OFFSET VALUE=0
  {% endif %}

  M117 Print complete

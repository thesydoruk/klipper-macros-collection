[gcode_macro PRINT_END]
description: |
  Finalizes the print safely and cleanly:
    - Retracts filament and lifts Z
    - Parks toolhead to configurable corner
    - Turns off heaters and fans
    - Resets motion and extrusion multipliers
    - Clears mesh leveling
    - Optionally resets probe_eddy_ng tap offset

  Most parameters are configurable via the `_macro_globals` macro.

gcode:
  # === Load configuration values from global macro ===
  {% set g = printer["gcode_macro _macro_globals"] %}

  {% set retract_e = g.variable_end_retract_length|float %}
  {% set lift_z = g.variable_end_lift_z|float %}
  {% set park_x_val = g.variable_end_park_x %}
  {% set park_y_val = g.variable_end_park_y %}

  # === Resolve final X/Y parking from config limits (settings = parsed floats) ===
  {% set sx = printer.configfile.settings["stepper_x"] %}
  {% set sy = printer.configfile.settings["stepper_y"] %}
  {% if park_x_val == "min" %}
    {% set park_x = sx.position_min %}
  {% elif park_x_val == "max" %}
    {% set park_x = sx.position_max %}
  {% else %}
    {% set park_x = park_x_val|float %}
  {% endif %}
  {% if park_y_val == "min" %}
    {% set park_y = sy.position_min %}
  {% elif park_y_val == "max" %}
    {% set park_y = sy.position_max %}
  {% else %}
    {% set park_y = park_y_val|float %}
  {% endif %}

  # === PHASE: RETRACT & LIFT ===
  M117 Ending...
  M118 ===> PHASE RETRACT & LIFT
  M400
  CLEAR_PAUSE
  {% if printer.toolhead.homed_axes|lower == "xyz" %}
    G91
    G1 E-{retract_e} F1800
    G1 Z{lift_z} F900
    G90
  {% else %}
    RESPOND TYPE=echo MSG="PRINT_END: axes not fully homed; skip retract/lift/park"
    G90
  {% endif %}

  # === PHASE: PARK ===
  {% if printer.toolhead.homed_axes|lower == "xyz" %}
    M118 ===> PHASE PARK
    G1 X{park_x} Y{park_y} F6000
  {% endif %}

  # === PHASE: COOLDOWN ===
  M118 ===> PHASE COOLDOWN
  M104 S0
  M140 S0
  M106 S0
  M107

  # === PHASE: RESET ===
  M118 ===> PHASE RESET
  {% if printer.bed_mesh %}
    BED_MESH_CLEAR
  {% endif %}
  M220 S100
  M221 S100
  RESET_LAYER_GCODE
  DISABLE_PRINT_CHECKPOINT

  # === Reset EDDY_NG tap offset if active ===
  {% set has_probe_eddy_ng = printer.configfile.config|dictsort|map(attribute=0)|select("match", "^probe_eddy_ng")|list|length > 0 %}
  {% if has_probe_eddy_ng %}
    PROBE_EDDY_NG_SET_TAP_OFFSET VALUE=0
  {% endif %}

  M117 Print complete

# print_end.cfg — end-of-print cleanup: retract/lift/park, cooldown, resets.
# Public: PRINT_END. Park X/Y accept "min", "max", or a number (see _macro_globals).

# ---------------------------------------------------------------------------
# Internal: relative retract + Z lift (caller must ensure XYZ homed).
# ---------------------------------------------------------------------------
[gcode_macro _PRINT_END_RETRACT_LIFT]
description: Internal. G91 retract E and lift Z, then G90 (no XY travel).
gcode:
  G91
  G1 E-{params.RETRACT|float} F1800
  G1 Z{params.LIFT|float} F900
  G90

# ---------------------------------------------------------------------------
# Internal: travel to park corner after retract/lift (G90 must be active).
# ---------------------------------------------------------------------------
[gcode_macro _PRINT_END_MOVE_PARK]
description: Internal. G1 to park X/Y at F6000.
gcode:
  G1 X{params.PARK_X|float} Y{params.PARK_Y|float} F6000

# ---------------------------------------------------------------------------
# Public: safe shutdown after a print job.
# ---------------------------------------------------------------------------
[gcode_macro PRINT_END]
description: |
  Finalizes the print safely and cleanly:
    - Retracts filament and lifts Z
    - Parks toolhead to configurable corner
    - Turns off heaters and fans
    - Resets motion and extrusion multipliers
    - Clears mesh leveling
    - Optionally resets probe_eddy_ng tap offset

  Most parameters are configurable via the `_macro_globals` macro.

gcode:
  # --- Tunables from globals ---
  {% set g = printer["gcode_macro _macro_globals"] %}
  {% set retract_e = g.variable_end_retract_length|float %}
  {% set lift_z = g.variable_end_lift_z|float %}
  {% set park_x_val = g.variable_end_park_x %}
  {% set park_y_val = g.variable_end_park_y %}

  # --- Resolve park corner: literal mm or "min"/"max" from stepper limits ---
  {% set sx = printer.configfile.settings["stepper_x"] %}
  {% set sy = printer.configfile.settings["stepper_y"] %}
  {% if park_x_val == "min" %}
    {% set park_x = sx.position_min %}
  {% elif park_x_val == "max" %}
    {% set park_x = sx.position_max %}
  {% else %}
    {% set park_x = park_x_val|float %}
  {% endif %}
  {% if park_y_val == "min" %}
    {% set park_y = sy.position_min %}
  {% elif park_y_val == "max" %}
    {% set park_y = sy.position_max %}
  {% else %}
    {% set park_y = park_y_val|float %}
  {% endif %}

  # --- Motion phase: only when fully homed (avoid crashes into unknown Z) ---
  M117 Ending...
  M118 ===> PHASE RETRACT & LIFT
  M400
  CLEAR_PAUSE
  {% if printer.toolhead.homed_axes|lower == "xyz" %}
    _PRINT_END_RETRACT_LIFT RETRACT={retract_e} LIFT={lift_z}
    M118 ===> PHASE PARK
    _PRINT_END_MOVE_PARK PARK_X={park_x} PARK_Y={park_y}
  {% else %}
    RESPOND TYPE=echo MSG="PRINT_END: axes not fully homed; skip retract/lift/park"
    G90
  {% endif %}

  # --- Heaters and part cooling off ---
  M118 ===> PHASE COOLDOWN
  M104 S0
  M140 S0
  M106 S0
  M107

  # --- Slicer / session state back to defaults ---
  M118 ===> PHASE RESET
  {% if printer.bed_mesh %}
    BED_MESH_CLEAR
  {% endif %}
  M220 S100
  M221 S100
  RESET_LAYER_GCODE
  DISABLE_PRINT_CHECKPOINT

  # --- Optional: clear eddy NG tap offset if that probe class is installed ---
  {% set has_probe_eddy_ng = printer.configfile.config|dictsort|map(attribute=0)|select("match", "^probe_eddy_ng")|list|length > 0 %}
  {% if has_probe_eddy_ng %}
    PROBE_EDDY_NG_SET_TAP_OFFSET VALUE=0
  {% endif %}

  M117 Print complete

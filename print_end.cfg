[gcode_macro PRINT_END]
description: |
  Finalizes the print safely and cleanly:
    - Retracts filament and lifts Z
    - Parks toolhead to configurable corner
    - Turns off heaters and fans
    - Resets motion and extrusion multipliers
    - Clears mesh leveling
    - Optionally resets probe_eddy_ng tap offset

# === Begin macro logic ===
gcode:
  # === Load optional user-configurable variables from shared macro (_print_settings) ===
  {% set ps = printer["gcode_macro _print_settings"] %}

  # Filament retract at end of print (in mm)
  {% set retract_e = ps.variable_end_retract_length|default(2.0)|float %}

  # Z lift after print (in mm)
  {% set lift_z = ps.variable_end_lift_z|default(10.0)|float %}

  # X/Y parking preferences: "min", "max", or numeric (e.g. "100")
  {% set park_x_val = ps.variable_end_park_x|default("min") %}
  {% set park_y_val = ps.variable_end_park_y|default("max") %}

  # === Determine actual park coordinates from config or hardcoded value ===
  {% if park_x_val == "min" %}
    {% set park_x = printer.configfile.config["stepper_x"].position_min %}
  {% elif park_x_val == "max" %}
    {% set park_x = printer.configfile.config["stepper_x"].position_max %}
  {% else %}
    {% set park_x = park_x_val|float %}
  {% endif %}

  {% if park_y_val == "min" %}
    {% set park_y = printer.configfile.config["stepper_y"].position_min %}
  {% elif park_y_val == "max" %}
    {% set park_y = printer.configfile.config["stepper_y"].position_max %}
  {% else %}
    {% set park_y = park_y_val|float %}
  {% endif %}

  # === Start end sequence ===
  M117 Ending...
  M118 ===> PHASE RETRACT & LIFT

  # === Step 1: Retract filament and raise nozzle ===
  G91 ; Set relative positioning
  G1 E-{retract_e} F1800 ; Retract filament
  G1 Z{lift_z} F900      ; Lift Z by configured amount
  G90 ; Restore absolute positioning

  # === Step 2: Move toolhead to a safe corner ===
  M118 ===> PHASE PARK
  G1 X{park_x} Y{park_y} F6000 ; Move to park position

  # === Step 3: Cooldown system ===
  M118 ===> PHASE COOLDOWN
  M104 S0 ; Turn off hotend
  M140 S0 ; Turn off heated bed
  M106 S0 ; Turn off part cooling fan

  # === Step 4: Reset printer state ===
  M118 ===> PHASE RESET
  BED_MESH_CLEAR ; Clear mesh leveling
  M220 S100      ; Reset speed factor
  M221 S100      ; Reset flow factor

  # === Step 5: Eddy NG cleanup (if active) ===
  {% set has_probe_eddy_ng = printer.configfile.config|dictsort|map(attribute=0)|select("match", "^probe_eddy_ng ")|list|length > 0 %}
  {% if has_probe_eddy_ng %}
    PROBE_EDDY_NG_SET_TAP_OFFSET VALUE=0
  {% endif %}

  # === Final message ===
  M117 Print complete

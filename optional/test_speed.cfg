[gcode_macro TEST_SPEED]
description: |
  Based on original motion test macro from: https://github.com/AndrewEllis93/Print-Tuning-Guide/blob/main/macros/TEST_SPEED.cfg
  This version has been adapted with parameterization via `_macro_globals`.

  Runs a motion integrity test by commanding high-speed toolhead movement.
  Includes large and small pattern loops to detect skipped steps.
  Restores all velocity/motion limits and G-code state after test.
  Default parameters are configurable in `_macro_globals`.

  Parameters:
    SPEED: Target velocity (mm/s)
    ACCEL: Acceleration (mm/s²)
    ITERATIONS: Number of movement loops
    MIN_CRUISE_RATIO: For junction deviation (if supported)
    BOUND: Safety margin from axis edges
    SMALLPATTERNSIZE: Width of small center pattern

gcode:
  # === Load configuration from globals or override with params ===
  {% set g = printer["gcode_macro _macro_globals"] %}
  {% set speed = params.SPEED|default(g.variable_test_speed_default_velocity)|int %}
  {% set accel = params.ACCEL|default(g.variable_test_speed_default_accel)|int %}
  {% set iterations = params.ITERATIONS|default(g.variable_test_speed_iterations)|int %}
  {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(g.variable_test_speed_min_cruise_ratio)|float %}
  {% set bound = params.BOUND|default(g.variable_test_speed_bound)|int %}
  {% set small = params.SMALLPATTERNSIZE|default(g.variable_test_speed_small_pattern_size)|int %}

  # === Define motion area bounds based on printer limits and bounds ===
  {% set x_min = printer.toolhead.axis_minimum.x + bound %}
  {% set x_max = printer.toolhead.axis_maximum.x - bound %}
  {% set y_min = printer.toolhead.axis_minimum.y + bound %}
  {% set y_max = printer.toolhead.axis_maximum.y - bound %}
  {% set x_center = (printer.toolhead.axis_minimum.x + printer.toolhead.axis_maximum.x) / 2 %}
  {% set y_center = (printer.toolhead.axis_minimum.y + printer.toolhead.axis_maximum.y) / 2 %}
  {% set x_center_min = x_center - (small / 2) %}
  {% set x_center_max = x_center + (small / 2) %}
  {% set y_center_min = y_center - (small / 2) %}
  {% set y_center_max = y_center + (small / 2) %}

  # === Save G-code state so we can restore it after test ===
  SAVE_GCODE_STATE NAME=TEST_SPEED
  RESPOND TYPE=echo MSG="TEST_SPEED: running {{ iterations }} iterations at {{ speed }} mm/s, accel {{ accel }} mm/s²"

  # === Ensure printer is homed and optionally QGL'd before test ===
  M400
  G28
  {% if 'quad_gantry_level' in printer and not printer.quad_gantry_level.applied %}
    QUAD_GANTRY_LEVEL
    G28 Z
  {% endif %}

  # === Move to known good location for testing ===
  G90
  G1 X{printer.toolhead.axis_maximum.x - 50} Y{printer.toolhead.axis_maximum.y - 50} F1800
  G28 X Y
  G0 X{printer.toolhead.axis_maximum.x - 1} Y{printer.toolhead.axis_maximum.y - 1} F1800
  G4 P1000

  # === Record starting position (after queue drain; toolhead.position is not updated by GET_POSITION) ===
  RESPOND TYPE=command MSG="TEST_SPEED: capturing initial position"
  M400
  {% set x0 = printer.toolhead.position.x %}
  {% set y0 = printer.toolhead.position.y %}
  {% set z0 = printer.toolhead.position.z %}

  # === Move to test start height ===
  G0 X{x_min} Y{y_min} Z{bound + 10} F{speed * 60}

  # === Apply test motion limits ===
  {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
    SET_VELOCITY_LIMIT FORCE=1 VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={min_cruise_ratio}
  {% else %}
    SET_VELOCITY_LIMIT FORCE=1 VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
  {% endif %}

  # === Run motion test patterns ===
  {% for i in range(iterations) %}
    # Large diagonals
    G0 X{x_min} Y{y_min} F{speed * 60}
    G0 X{x_max} Y{y_max} F{speed * 60}
    G0 X{x_min} Y{y_min} F{speed * 60}
    G0 X{x_max} Y{y_min} F{speed * 60}
    G0 X{x_min} Y{y_max} F{speed * 60}
    G0 X{x_max} Y{y_min} F{speed * 60}

    # Large box
    G0 X{x_min} Y{y_min} F{speed * 60}
    G0 X{x_min} Y{y_max} F{speed * 60}
    G0 X{x_max} Y{y_max} F{speed * 60}
    G0 X{x_max} Y{y_min} F{speed * 60}

    # Small diagonals
    G0 X{x_center_min} Y{y_center_min} F{speed * 60}
    G0 X{x_center_max} Y{y_center_max} F{speed * 60}
    G0 X{x_center_min} Y{y_center_min} F{speed * 60}
    G0 X{x_center_max} Y{y_center_min} F{speed * 60}
    G0 X{x_center_min} Y{y_center_max} F{speed * 60}
    G0 X{x_center_max} Y{y_center_min} F{speed * 60}

    # Small box
    G0 X{x_center_min} Y{y_center_min} F{speed * 60}
    G0 X{x_center_min} Y{y_center_max} F{speed * 60}
    G0 X{x_center_max} Y{y_center_max} F{speed * 60}
    G0 X{x_center_max} Y{y_center_min} F{speed * 60}
  {% endfor %}

  # === Restore velocity limits to defaults ===
  {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
    SET_VELOCITY_LIMIT FORCE=1 VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio}
  {% else %}
    SET_VELOCITY_LIMIT FORCE=1 VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
  {% endif %}

  # === Re-home and compare final position to detect skips ===
  M400
  G28
  G90
  G0 X{printer.toolhead.axis_maximum.x - 1} Y{printer.toolhead.axis_maximum.y - 1} F1800
  G4 P1000

  M400
  {% set x1 = printer.toolhead.position.x %}
  {% set y1 = printer.toolhead.position.y %}
  {% set z1 = printer.toolhead.position.z %}
  {% set dx = (x1 - x0)|round(3) %}
  {% set dy = (y1 - y0)|round(3) %}
  {% set dz = (z1 - z0)|round(3) %}
  RESPOND TYPE=echo MSG="TEST_SPEED delta: dX={{ dx }} dY={{ dy }} dZ={{ dz }} (mm)"

  # === Restore prior G-code context ===
  RESTORE_GCODE_STATE NAME=TEST_SPEED
  M117 TEST COMPLETE

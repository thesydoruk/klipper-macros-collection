[gcode_macro AUTOTUNE_SGTHRS_PHASE]
description: |
  This macro performs an automated tuning of the StallGuard threshold (SGTHRS or SGT)
  for sensorless homing and motion experiments. It moves the selected stepper through a
  square pattern at a user-defined range and speed, reads SG_RESULT under load, and measures
  positional deviation before and after homing. Based on stalls and deviations, it recommends
  the optimal threshold value.

  Key features:
    • Sensorless stall detection across full build–area center pattern
    • Configurable feedrate, acceleration, and movement range
    • Validation of both MCU-reported drift and post-home accuracy
    • Default values loaded from `_macro_globals`, easily overridden in call

  Usage example:
    AUTOTUNE_SGTHRS_PHASE STEPPER=stepper_x RANGE=20 Z_SAFE=5

  Parameters:
    STEPPER: stepper name
    STEP: SG step size
    FEED: feedrate mm/s
    ACCEL: acceleration mm/s²
    RANGE: movement half-edge mm
    Z_SAFE: safe Z height mm
    MCU_TOLERANCE: pre-home deviation mm
    REHOME_TOLERANCE: post-home deviation mm
    SG_OK_THRESHOLD: max SG_RESULT to flag stall
    SG_MIN: min SG to test
    SG_MAX: max SG to test

gcode:
  # Normalize parameters to uppercase attributes
  {% set g = printer['gcode_macro _macro_globals'] %}
  {% set ns = namespace(**{ key.upper(): val for key, val in params.items() }) %}

  # Load values with defaults
  {% set STEPPER          = ns.STEPPER %}
  {% set STEP             = ns.STEP|default(g.variable_sgthrs_step)|int %}
  {% set FEED             = ns.FEED|default(g.variable_sgthrs_feedrate)|int %}
  {% set ACCEL            = ns.ACCEL|default(g.variable_sgthrs_accel)|int %}
  {% set RANGE            = ns.RANGE|default(g.variable_sgthrs_move_range)|float %}
  {% set Z_SAFE           = ns.Z_SAFE|default(g.variable_sgthrs_z_safe)|int %}
  {% set MCU_TOLERANCE    = ns.MCU_TOLERANCE|default(g.variable_sgthrs_mcu_tol)|float %}
  {% set REHOME_TOLERANCE = ns.REHOME_TOLERANCE|default(g.variable_sgthrs_rehome_tol)|float %}
  {% set SG_OK_THRESHOLD  = ns.SG_OK_THRESHOLD|default(g.variable_sgthrs_sg_ok_threshold)|int %}
  {% set SG_MIN           = ns.SG_MIN|default(g.variable_sgthrs_sg_min)|int %}
  {% set SG_MAX           = ns.SG_MAX|default(g.variable_sgthrs_sg_max)|int %}
  {% set success          = namespace(best=None) %}

  # Validate required parameters
  {% if not STEPPER %}
    RESPOND TYPE=error MSG="Missing STEPPER"
    RETURN
  {% endif %}
  {% if RANGE is none %}
    RESPOND TYPE=error MSG="Missing RANGE"
    RETURN
  {% endif %}
  {% if Z_SAFE is none %}
    RESPOND TYPE=error MSG="Missing Z_SAFE"
    RETURN
  {% endif %}

  # Detect TMC driver
  {% set driver = none %}
  {% for p in ['tmc2209','tmc2225','tmc2226','tmc5160','tmc2130','tmc2660'] %}
    {% if printer[p ~ ' ' ~ STEPPER] is defined %}
      {% set driver = p ~ ' ' ~ STEPPER %}
      {% break %}
    {% endif %}
  {% endfor %}
  {% if not driver %}
    RESPOND TYPE=error MSG="No driver for {STEPPER}"
    RETURN
  {% endif %}

  # Choose SG field based on driver
  {% set SG_FIELD = 'SGTHRS' if 'tmc22' in driver else 'SGT' %}

  # Prepare and record reference position
  SAVE_GCODE_STATE NAME=AUTOTUNE_SGTHRS
  G28
  G0 Z{Z_SAFE} F1800
  GET_POSITION
  {% set x0 = printer.toolhead.position.x %}
  {% set y0 = printer.toolhead.position.y %}
  RESPOND TYPE=echo MSG="📌 Ref pos X={{ (x0|round(3)) }} Y={{ (y0|round(3)) }}"

  # Compute center of test area
  {% set cx = (printer.toolhead.axis_minimum.x + printer.toolhead.axis_maximum.x) / 2 %}
  {% set cy = (printer.toolhead.axis_minimum.y + printer.toolhead.axis_maximum.y) / 2 %}

  # Scan SG values
  {% for sg in range(SG_MIN, SG_MAX + 1, STEP) %}
    RESPOND TYPE=command MSG="🔍 Test {SG_FIELD}={sg}"
    SET_TMC_FIELD STEPPER={STEPPER} FIELD={SG_FIELD} VALUE={sg}
    SET_VELOCITY_LIMIT VELOCITY={FEED} ACCEL={ACCEL}
    G0 X{cx - RANGE} Y{cy - RANGE} F{FEED * 60}
    G0 X{cx + RANGE} Y{cy - RANGE} F{FEED * 60}
    G0 X{cx + RANGE} Y{cy + RANGE} F{FEED * 60}
    G0 X{cx - RANGE} Y{cy + RANGE} F{FEED * 60}
    # Diagonals
    G0 X{cx - RANGE} Y{cy - RANGE} F{FEED * 60}
    G0 X{cx + RANGE} Y{cy + RANGE} F{FEED * 60}
    G0 X{cx + RANGE} Y{cy - RANGE} F{FEED * 60}
    G0 X{cx - RANGE} Y{cy + RANGE} F{FEED * 60}
    G0 X{cx} Y{cy} F{FEED * 60}
    M400

    # Read and report SG_RESULT
    {% set val = printer[driver].sg_result | default(999) %}
    RESPOND TYPE=echo MSG="📊 SG_RESULT={val}"

    # Return to reference and measure drift
    G0 X{x0} Y{y0} F{FEED * 60}
    M400
    GET_POSITION
    {% set dx = (printer.toolhead.position.x - x0)|abs %}
    {% set dy = (printer.toolhead.position.y - y0)|abs %}
    RESPOND TYPE=echo MSG="🧠 dX={{ (dx|round(3)) }} dY={{ (dy|round(3)) }}"

    # Rehome XY and measure post-home offset
    G28 X Y
    GET_POSITION
    {% set hx = (printer.toolhead.position.x - x0)|abs %}
    {% set hy = (printer.toolhead.position.y - y0)|abs %}

    # Evaluate stall and deviations
    {% set dev_error = dx > MCU_TOLERANCE or dy > MCU_TOLERANCE or hx > REHOME_TOLERANCE or hy > REHOME_TOLERANCE %}
    {% if val < SG_OK_THRESHOLD and dev_error %}
      RESPOND TYPE=echo MSG="✔ {SG_FIELD}={sg}"
      {% set success.best = sg %}
      {% break %}
    {% else %}
      RESPOND TYPE=echo MSG="✖ {SG_FIELD}={sg}"
    {% endif %}
  {% endfor %}

  # Final recommendation or error
  {% if success.best is not none %}
    RESPOND TYPE=echo MSG="Recommend {SG_FIELD}={success.best}"
  {% else %}
    RESPOND TYPE=error MSG="No valid {SG_FIELD} in {SG_MIN}–{SG_MAX}"
  {% endif %}

  RESTORE_GCODE_STATE NAME=AUTOTUNE_SGTHRS

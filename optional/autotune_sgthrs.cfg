[gcode_macro AUTOTUNE_SGTHRS_PHASE]
description: |
  Adaptive StallGuard threshold autotune for sensorless homing/motion.
  Runs multi-scale motion patterns to evaluate SG_RESULT under load.
  Reports recommended SGTHRS (or SGT) value based on deviation detection.
  Default step, acceleration, bounds, and tolerances can be configured via `_macro_globals`.
  Based on macro by @thesidoruk.

  Parameters:
    STEPPER: Name of the stepper to test (e.g. stepper_x)
    STEP: SGTHRS step size
    FEED: Velocity (mm/s)
    ACCEL: Acceleration (mm/s²)
    BOUND: Margin from edge (mm)
    MCU_TOLERANCE / REHOME_TOLERANCE: Tolerances for deviation checks
    SCALE_STEPS: Number of scaling iterations
    SG_OK_THRESHOLD: Max SG_RESULT to consider as a stall
    MIN / MAX: Range to scan

gcode:
  # Ensure required parameter is provided
  {% if params.STEPPER is not defined %}
    RESPOND TYPE=error MSG="Missing required parameter: STEPPER"
    RETURN
  {% endif %}

  # Load configuration and parameters
  {% set g = printer["gcode_macro _macro_globals"] %}
  {% set stepper = params.STEPPER %}
  {% set sg_step = params.STEP|default(g.variable_sgthrs_step)|int %}
  {% set feed = params.FEED|default(g.variable_sgthrs_feedrate)|int %}
  {% set accel = params.ACCEL|default(g.variable_sgthrs_accel)|int %}
  {% set bound = params.BOUND|default(g.variable_sgthrs_bound)|int %}
  {% set mcu_tol = params.MCU_TOLERANCE|default(g.variable_sgthrs_mcu_tol)|float %}
  {% set rehome_tol = params.REHOME_TOLERANCE|default(g.variable_sgthrs_rehome_tol)|float %}
  {% set scale_steps = params.SCALE_STEPS|default(g.variable_sgthrs_scale_steps)|int %}
  {% set sg_threshold = params.SG_OK_THRESHOLD|default(g.variable_sgthrs_sg_ok_threshold)|int %}
  {% set success = namespace(best=None) %}

  # Identify driver based on known prefix list
  {% set ns = namespace(driver=None) %}
  {% for prefix in ["tmc2209", "tmc2225", "tmc2226", "tmc5160", "tmc2130", "tmc2660"] %}
    {% set candidate = prefix ~ " " ~ stepper %}
    {% if candidate in printer %}
      {% set ns.driver = candidate %}
      {% break %}
    {% endif %}
  {% endfor %}
  {% if ns.driver is none %}
    RESPOND TYPE=error MSG="Could not detect driver for stepper '%s'" % (stepper,)
    RETURN
  {% endif %}

  # Determine which field and value range to use based on driver type
  {% if "tmc2209" in ns.driver or "tmc2225" in ns.driver or "tmc2226" in ns.driver %}
    {% set default_min = 0 %}
    {% set default_max = 255 %}
    {% set sg_field = "SGTHRS" %}
  {% else %}
    {% set default_min = -64 %}
    {% set default_max = 63 %}
    {% set sg_field = "SGT" %}
  {% endif %}
  {% set min_sg = params.MIN|default(default_min)|int %}
  {% set max_sg = params.MAX|default(default_max)|int %}

  # Prepare environment and capture reference position
  SAVE_GCODE_STATE NAME=AUTOTUNE_SGTHRS
  G90
  M400
  G28
  M400
  G0 Z{bound + 5} F1800
  GET_POSITION
  {% set x0 = printer.toolhead.position.x %}
  {% set y0 = printer.toolhead.position.y %}
  RESPOND TYPE=echo MSG="Reference pos: X=%.3f Y=%.3f" % (x0, y0)

  # Define test area based on bed size and configured bounds
  {% set bed_xmin = printer.toolhead.axis_minimum.x + bound %}
  {% set bed_xmax = printer.toolhead.axis_maximum.x - bound %}
  {% set bed_ymin = printer.toolhead.axis_minimum.y + bound %}
  {% set bed_ymax = printer.toolhead.axis_maximum.y - bound %}
  {% set center_x = (bed_xmin + bed_xmax) / 2 %}
  {% set center_y = (bed_ymin + bed_ymax) / 2 %}
  {% set dx = (bed_xmax - bed_xmin) / 3 %}
  {% set dy = (bed_ymax - bed_ymin) / 3 %}

  # Iterate through SGTHRS/SGT values
  {% for sg in range(min_sg, max_sg + 1, sg_step) %}
    RESPOND TYPE=command MSG="🔍 Testing SGTHRS=%d with ACCEL=%d" % (sg, accel)
    SET_TMC_FIELD STEPPER={stepper} FIELD={sg_field} VALUE={sg}

    # Execute scaled movement patterns
    {% for i in range(scale_steps) %}
      {% set scale = 1.0 - (i / (scale_steps - 1)) * 0.9 %}
      {% set x_range = dx * scale %}
      {% set y_range = dy * scale %}
      {% set x1 = center_x - x_range %}
      {% set x2 = center_x + x_range %}
      {% set y1 = center_y - y_range %}
      {% set y2 = center_y + y_range %}

      RESPOND TYPE=command MSG="➡️ Scale=%.2f" % (scale,)
      SET_VELOCITY_LIMIT VELOCITY={feed} ACCEL={accel}
      G0 X{x1} Y{y1} F{feed * 60}
      G0 X{x2} Y{y1} F{feed * 60}
      G0 X{x2} Y{y2} F{feed * 60}
      G0 X{x1} Y{y2} F{feed * 60}
      G0 X{x1} Y{y1} F{feed * 60}
      G0 X{x2} Y{y2} F{feed * 60}
      G0 X{x1} Y{y2} F{feed * 60}
      G0 X{x2} Y{y1} F{feed * 60}
      G0 X{center_x} Y{center_y} F{feed * 60}
      M400
    {% endfor %}

    # Read SG_RESULT and calculate position deltas
    {% set sg_val = printer[ns.driver].sg_result|default(999) %}
    RESPOND TYPE=echo MSG="📊 SG_RESULT=%d" % (sg_val)

    G0 X{x0} Y{y0} F{feed * 60}
    M400
    GET_POSITION
    {% set x1 = printer.toolhead.position.x %}
    {% set y1 = printer.toolhead.position.y %}
    {% set dx_logic = (x1 - x0)|round(4) %}
    {% set dy_logic = (y1 - y0)|round(4) %}
    RESPOND TYPE=echo MSG="🧠 MCU delta: ΔX=%.3f ΔY=%.3f" % (dx_logic, dy_logic)

    G28 X Y
    M400
    GET_POSITION
    {% set x2 = printer.toolhead.position.x %}
    {% set y2 = printer.toolhead.position.y %}
    {% set dx_home = (x2 - x0)|round(4) %}
    {% set dy_home = (y2 - y0)|round(4) %}
    RESPOND TYPE=echo MSG="📏 Rehome delta: ΔX=%.3f ΔY=%.3f" % (dx_home, dy_home)

    # Evaluate if deviation is acceptable and SG triggered
    {% set mcu_error = dx_logic|abs > mcu_tol or dy_logic|abs > mcu_tol %}
    {% set rehome_error = dx_home|abs > rehome_tol or dy_home|abs > rehome_tol %}

    {% if sg_val < sg_threshold and (mcu_error or rehome_error) %}
      RESPOND TYPE=echo MSG="✅ SGTHRS=%d VALID — StallGuard + deviation detected" % (sg)
      {% set success.best = sg %}
      {% break %}
    {% else %}
      RESPOND TYPE=echo MSG="❌ SGTHRS=%d rejected (no stall or no deviation)" % (sg)
    {% endif %}
  {% endfor %}

  # Report final result
  {% if success.best is not none %}
    {% set config_name = "driver_" ~ sg_field %}
    RESPOND TYPE=echo MSG="🎯 Recommended config line: %s=%d" % (config_name, success.best)
  {% else %}
    RESPOND TYPE=error MSG="❌ No working SGTHRS found in range %d–%d" % (min_sg, max_sg)
  {% endif %}

  # Restore printer state
  RESTORE_GCODE_STATE NAME=AUTOTUNE_SGTHRS

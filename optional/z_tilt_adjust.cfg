# optional/z_tilt_adjust.cfg — wrap stock Z_TILT_ADJUST with optional coarse pass + lift.

[gcode_macro Z_TILT_ADJUST]
description: |
  Enhanced Z tilt adjustment macro with conditional high-clearance first pass.
  This macro lifts the toolhead before applying Z_TILT_ADJUST and always performs a second refinement pass.
  The lift height is configurable via `_macro_globals.variable_z_tilt_lift`.

rename_existing: _Z_TILT_ADJUST

gcode:
  {% set g = printer["gcode_macro _macro_globals"] %}
  {% set lift = g.variable_z_tilt_lift|float %}

  SAVE_GCODE_STATE NAME=STATE_Z_TILT

  {% if printer.bed_mesh %}
    BED_MESH_CLEAR
  {% endif %}

  {% if not printer.z_tilt.applied %}
    _Z_TILT_ADJUST horizontal_move_z={lift} retry_tolerance=1
  {% endif %}

  _Z_TILT_ADJUST

  RESTORE_GCODE_STATE NAME=STATE_Z_TILT

[gcode_macro QUAD_GANTRY_LEVEL]
description: |
  Enhanced quad gantry leveling with conditional high-clearance first pass.
  This macro lifts the gantry before performing a coarse level and always performs a final refinement.
  The lift height is configurable via `_macro_globals.variable_qgl_lift`.

rename_existing: _QUAD_GANTRY_LEVEL

gcode:
  # === Load configuration from macro globals ===
  {% set g = printer["gcode_macro _macro_globals"] %}
  {% set lift = g.variable_qgl_lift|float %}

  # === Save current motion and coordinate state ===
  SAVE_GCODE_STATE NAME=STATE_QGL

  # === Clear any mesh to ensure leveling is not affected ===
  BED_MESH_CLEAR

  # === First pass: Coarse leveling at elevated height if not already done ===
  {% if not printer.quad_gantry_level.applied %}
    _QUAD_GANTRY_LEVEL horizontal_move_z={lift} retry_tolerance=1
  {% endif %}

  # === Second pass: Always perform refinement leveling ===
  _QUAD_GANTRY_LEVEL

  # === Restore previous G-code motion state ===
  RESTORE_GCODE_STATE NAME=STATE_QGL

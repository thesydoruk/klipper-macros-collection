; Optional print bookmark + recovery prep for SD prints (with [save_variables]).
;
; Requires in printer.cfg:
;   [save_variables]
;   filename: ~/printer_data/config/print_checkpoint_vars.cfg
;
; Recovery (RECOVER_PRINT_CHECKPOINT):
;   - Default AUTO_SD=1: loads file via virtual_sdcard (SDCARD_RESET_FILE, M23, M26 S<file_pos>),
;     prepares pose (G28 X Y, pause park, SET_KINEMATIC_POSITION, G1 to saved XYZ), heats, M24.
;     No Moonraker "resume job" UI required; file must still exist under [virtual_sdcard] path.
;   - AUTO_SD=0: legacy — expect print already paused at offset (e.g. Moonraker), then RESUME.
;   - Physical nozzle must clear the part; wrong Z/sync can crash. [force_move] optional.
;   - Optional shell: install [gcode_shell_command] (e.g. KIAUH), define CMD=…, then e.g.
;       [gcode_macro RECOVER_WITH_HOOK]
;       gcode:
;         RUN_SHELL_COMMAND CMD=my_script PARAMS=arg1
;         RECOVER_PRINT_CHECKPOINT
;
; Public: ENABLE_PRINT_CHECKPOINT, DISABLE_PRINT_CHECKPOINT, READ_PRINT_CHECKPOINT,
;         RECOVER_PRINT_CHECKPOINT
; Internal: _PRINT_CHECKPOINT_STATE, delayed_gcode _PRINT_CHECKPOINT_TICK

[gcode_macro _PRINT_CHECKPOINT_STATE]
description: Internal — checkpoint polling enabled flag and interval (s).
variable_enabled: False
variable_interval: 10.0
gcode:
  RESPOND TYPE=echo MSG="print_checkpoint: enabled={enabled} interval={interval}s"

[delayed_gcode _PRINT_CHECKPOINT_TICK]
initial_duration: 0
gcode:
  {% set st = printer["gcode_macro _PRINT_CHECKPOINT_STATE"] %}
  {% set iv = st.interval|float %}
  {% if not st.enabled %}
    UPDATE_DELAYED_GCODE ID=_PRINT_CHECKPOINT_TICK DURATION=0
  {% elif "save_variables" not in printer %}
    RESPOND TYPE=error MSG="print_checkpoint: add [save_variables] to printer.cfg"
    SET_GCODE_VARIABLE MACRO=_PRINT_CHECKPOINT_STATE VARIABLE=enabled VALUE=False
    UPDATE_DELAYED_GCODE ID=_PRINT_CHECKPOINT_TICK DURATION=0
  {% else %}
    {% set vs_active = printer.virtual_sdcard|default({}).is_active|default(False) %}
    {% if vs_active %}
      {% set p = printer.gcode_move.gcode_position %}
      {% set vs = printer.virtual_sdcard %}
      {% set inf = printer.print_stats.info|default({}) %}
      {% set lay = inf.current_layer|default(-1)|int %}
      SAVE_VARIABLE VARIABLE=print_ckpt_x VALUE="{p.x}"
      SAVE_VARIABLE VARIABLE=print_ckpt_y VALUE="{p.y}"
      SAVE_VARIABLE VARIABLE=print_ckpt_z VALUE="{p.z}"
      SAVE_VARIABLE VARIABLE=print_ckpt_e VALUE="{p.e}"
      SAVE_VARIABLE VARIABLE=print_ckpt_layer VALUE="{lay}"
      SAVE_VARIABLE VARIABLE=print_ckpt_file_position VALUE="{vs.file_position}"
      SAVE_VARIABLE VARIABLE=print_ckpt_progress VALUE="{vs.progress|default(0)|float}"
      {% set fn = vs.filename|default("")|replace("'", "_") %}
      SAVE_VARIABLE VARIABLE=print_ckpt_filename VALUE="{fn}"
      UPDATE_DELAYED_GCODE ID=_PRINT_CHECKPOINT_TICK DURATION={iv}
    {% else %}
      UPDATE_DELAYED_GCODE ID=_PRINT_CHECKPOINT_TICK DURATION=30
    {% endif %}
  {% endif %}

[gcode_macro ENABLE_PRINT_CHECKPOINT]
description: |
  Start periodic bookmarking during SD prints (save_variables + virtual_sdcard).
  Optional INTERVAL= seconds (default from _macro_globals.variable_checkpoint_interval).
gcode:
  {% if "save_variables" not in printer %}
    {action_raise_error("print_checkpoint: add [save_variables] to printer.cfg (see optional/print_checkpoint.cfg header)")}
  {% endif %}
  {% set g = printer["gcode_macro _macro_globals"] %}
  {% set iv = params.INTERVAL|default(g.variable_checkpoint_interval)|float %}
  {% if iv < 2.0 %}
    {action_raise_error("print_checkpoint: INTERVAL must be >= 2 s (SD wear / load)")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_PRINT_CHECKPOINT_STATE VARIABLE=interval VALUE={iv}
  SET_GCODE_VARIABLE MACRO=_PRINT_CHECKPOINT_STATE VARIABLE=enabled VALUE=True
  RESPOND TYPE=echo MSG="print_checkpoint: ENABLED every {iv}s during SD print"
  UPDATE_DELAYED_GCODE ID=_PRINT_CHECKPOINT_TICK DURATION={iv}

[gcode_macro DISABLE_PRINT_CHECKPOINT]
description: Stop periodic bookmarking and cancel the delayed tick.
gcode:
  SET_GCODE_VARIABLE MACRO=_PRINT_CHECKPOINT_STATE VARIABLE=enabled VALUE=False
  UPDATE_DELAYED_GCODE ID=_PRINT_CHECKPOINT_TICK DURATION=0
  RESPOND TYPE=echo MSG="print_checkpoint: disabled"

[gcode_macro READ_PRINT_CHECKPOINT]
description: |
  Print last saved bookmark to console (from save_variables). Use after power cycle
  together with Mainsail/Moonraker job history for manual resume planning — not auto-resume.
gcode:
  {% if "save_variables" not in printer %}
    RESPOND TYPE=error MSG="print_checkpoint: no save_variables"
  {% else %}
    {% set v = printer.save_variables.variables %}
    RESPOND TYPE=echo MSG="print_ckpt: X={{ v['print_ckpt_x']|default('?') }} Y={{ v['print_ckpt_y']|default('?') }} Z={{ v['print_ckpt_z']|default('?') }} E={{ v['print_ckpt_e']|default('?') }} layer={{ v['print_ckpt_layer']|default('?') }}"
    RESPOND TYPE=echo MSG="print_ckpt: file_pos={{ v['print_ckpt_file_position']|default('?') }} progress={{ v['print_ckpt_progress']|default('?') }} file={{ v['print_ckpt_filename']|default('?') }}"
  {% endif %}

[gcode_macro RECOVER_PRINT_CHECKPOINT]
description: |
  Recover from save_variables checkpoint. Default AUTO_SD=1: M23+M26 byte offset, pose prep, G1 to saved
  XYZ, heat, M24 (no Moonraker job restart). AUTO_SD=0: prep+heat then RESUME if already paused.
  BED EXTRUDER EXT LIFT SYNC_E SKIP_HEAT SKIP_RESUME AUTO_SD FILENAME= (override path) FILE_POS= (override).
gcode:
  {% if "save_variables" not in printer %}
    {action_raise_error("print_checkpoint: add [save_variables] to printer.cfg")}
  {% endif %}
  {% set v = printer.save_variables.variables %}
  {% set xs = v.print_ckpt_x|default(none) %}
  {% set ys = v.print_ckpt_y|default(none) %}
  {% set zs = v.print_ckpt_z|default(none) %}
  {% set es = v.print_ckpt_e|default(none) %}
  {% if xs is none or ys is none or zs is none %}
    {action_raise_error("print_checkpoint: missing print_ckpt_x/y/z in save_variables (enable checkpoint during prints)")}
  {% endif %}
  {% set sx = xs|float %}
  {% set sy = ys|float %}
  {% set sz = zs|float %}
  {% set se = es|default(0)|float %}
  {% set g = printer["gcode_macro _macro_globals"] %}
  {% set lift = params.LIFT|default(g.variable_pause_lift_z)|float %}
  {% set bed_t = params.BED|default(g.variable_pid_bed_temp)|float %}
  {% if 'EXTRUDER' in params %}
    {% set ext_t = params.EXTRUDER|float %}
  {% elif 'EXT' in params %}
    {% set ext_t = params.EXT|float %}
  {% else %}
    {% set ext_t = g.variable_pid_ext_temp|float %}
  {% endif %}
  {% set sync_e = params.SYNC_E|default(1)|int %}
  {% set skip_heat = params.SKIP_HEAT|default(0)|int %}
  {% set skip_resume = params.SKIP_RESUME|default(0)|int %}
  {% set auto_sd = params.AUTO_SD|default(1)|int %}
  {% set pxv = g.variable_pause_park_x %}
  {% set pyv = g.variable_pause_park_y %}
  {% set sx_cfg = printer.configfile.settings["stepper_x"] %}
  {% set sy_cfg = printer.configfile.settings["stepper_y"] %}
  {% if pxv == "min" %}
    {% set park_x = sx_cfg.position_min %}
  {% elif pxv == "max" %}
    {% set park_x = sx_cfg.position_max %}
  {% else %}
    {% set park_x = pxv|float %}
  {% endif %}
  {% if pyv == "min" %}
    {% set park_y = sy_cfg.position_min %}
  {% elif pyv == "max" %}
    {% set park_y = sy_cfg.position_max %}
  {% else %}
    {% set park_y = pyv|float %}
  {% endif %}
  {% set xy_feed = g.variable_pause_park_feedrate|float %}
  {% set z_feed = g.variable_pause_lift_feedrate|float %}
  {% set z_logical = sz + lift %}
  {% set fp_raw = params.FILE_POS|default(v.print_ckpt_file_position|default(""))|string|trim %}
  {% set fn_raw = params.FILENAME|default(v.print_ckpt_filename|default(""))|string|trim %}
  {% set fp_int = fp_raw|int %}
  {% set fn_use = fn_raw %}
  RESPOND TYPE=echo MSG="print_checkpoint RECOVER: saved print XYZ=({sx},{sy},{sz}) park=({park_x},{park_y}) Z_after_pause_lift={z_logical} lift_mm={lift} AUTO_SD={auto_sd}"
  {% if auto_sd %}
    {% if "virtual_sdcard" not in printer %}
      {action_raise_error("print_checkpoint: AUTO_SD needs [virtual_sdcard]")}
    {% endif %}
    {% if fn_use|length < 1 %}
      {action_raise_error("print_checkpoint: missing filename in checkpoint (or pass FILENAME=)")}
    {% endif %}
    {% if fp_raw|length < 1 or fp_raw == "?" %}
      {action_raise_error("print_checkpoint: missing FILE_POS / print_ckpt_file_position in checkpoint")}
    {% endif %}
    {% if fp_int < 0 %}
      {action_raise_error("print_checkpoint: invalid FILE_POS / print_ckpt_file_position")}
    {% endif %}
    {% if "/" in fn_use %}
      RESPOND TYPE=echo MSG="print_checkpoint: path has subdir — M23 may fail if file is not in virtual_sdcard root; use FILENAME= flat name or a shell wrapper"
    {% endif %}
    {% if printer.virtual_sdcard.is_active|default(False) %}
      {action_raise_error("print_checkpoint: SD print active — cancel/stop before recover")}
    {% endif %}
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    M23 {fn_use}
    M26 S{fp_int}
    RESPOND TYPE=echo MSG="print_checkpoint RECOVER: loaded file={fn_use} file_pos={fp_int}"
  {% else %}
    {% set fp = fp_raw %}
    {% set fn = fn_use %}
    RESPOND TYPE=echo MSG="print_checkpoint RECOVER (AUTO_SD=0): file_pos={fp} file={fn}"
  {% endif %}
  G28 X Y
  G90
  G1 X{park_x} Y{park_y} F{xy_feed}
  M400
  SET_KINEMATIC_POSITION X={park_x} Y={park_y} Z={z_logical} SET_HOMED=XYZ
  SET_GCODE_VARIABLE MACRO=_PAUSE_PARK_STATE VARIABLE=saved_x VALUE="{sx}"
  SET_GCODE_VARIABLE MACRO=_PAUSE_PARK_STATE VARIABLE=saved_y VALUE="{sy}"
  SET_GCODE_VARIABLE MACRO=_PAUSE_PARK_STATE VARIABLE=saved_z VALUE="{sz}"
  {% if auto_sd %}
    SET_GCODE_VARIABLE MACRO=_PAUSE_PARK_STATE VARIABLE=pending VALUE=0
    G1 X{sx} Y{sy} F{xy_feed}
    G1 Z{sz} F{z_feed}
  {% else %}
    SET_GCODE_VARIABLE MACRO=_PAUSE_PARK_STATE VARIABLE=pending VALUE=1
  {% endif %}
  {% if sync_e %}
    M82
    G92 E{se}
  {% endif %}
  {% if skip_heat %}
    RESPOND TYPE=echo MSG="print_checkpoint RECOVER: SKIP_HEAT set — not waiting for temps"
  {% else %}
    M140 S{bed_t|int}
    M104 S{ext_t|int}
    M190 S{bed_t|int}
    M109 S{ext_t|int}
  {% endif %}
  {% if auto_sd %}
    {% if skip_resume %}
      RESPOND TYPE=echo MSG="print_checkpoint RECOVER: SKIP_RESUME=1 — call M24 when ready"
    {% else %}
      M400
      M24
      _SET_GLOBAL_STATE STATUS="printing"
      RESPOND TYPE=echo MSG="print_checkpoint RECOVER: M24 started SD from byte {fp_int}"
    {% endif %}
  {% elif skip_resume %}
    RESPOND TYPE=echo MSG="print_checkpoint RECOVER: SKIP_RESUME=1 — call RESUME when ready (print must be paused)"
  {% elif printer.pause_resume.is_paused %}
    RESUME
  {% else %}
    RESPOND TYPE=error MSG="print_checkpoint RECOVER: AUTO_SD=0 but print not paused — use AUTO_SD=1 or start paused job in Moonraker"
  {% endif %}

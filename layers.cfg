# layers.cfg — slicer layer hooks and deferred G-code (_LAYER_RUN scheduler).
# Requires [display_status] (or equivalent) for SET_PRINT_STATS_INFO / print_stats.
# Public: BEFORE/AFTER_LAYER_CHANGE, GCODE_AT_LAYER, INIT/RESET_LAYER_GCODE, etc.

[gcode_macro _LAYER_RUN]
description: Runs scheduled G-code for the current layer and passed Z height.
variable_cur_height: 0.0
variable_clearance_z: 0.0
variable_commands_layer: {}
variable_commands_height: {}
gcode:
  {% set info = printer.print_stats.info|default({}) %}
  {% set cur_layer = info.current_layer|default(-1)|int %}
  {% set cur_height = printer["gcode_macro _LAYER_RUN"].cur_height|float %}
  {% for key in commands_layer|list|sort %}
    {% if key <= cur_layer %}
      RESPOND TYPE=echo MSG="LAYER_RUN: layer {{ key }}"
      {% for c in commands_layer[key] %}
        {c}
      {% endfor %}
      {% set dummy = commands_layer.__delitem__(key) %}
    {% endif %}
  {% endfor %}
  SET_GCODE_VARIABLE MACRO=_LAYER_RUN VARIABLE=commands_layer VALUE="{
      commands_layer|replace('\"','\\\"')}"
  {% for key in commands_height|list|sort %}
    {% if key <= cur_height %}
      RESPOND TYPE=echo MSG="LAYER_RUN: height {{ key }}"
      {% for c in commands_height[key] %}
        {c}
      {% endfor %}
      {% set dummy = commands_height.__delitem__(key) %}
    {% endif %}
  {% endfor %}
  SET_GCODE_VARIABLE MACRO=_LAYER_RUN VARIABLE=commands_height VALUE="{
      commands_height|replace('\"','\\\"')}"

[gcode_macro BEFORE_LAYER_CHANGE]
description: |
  Slicer "before layer change" hook. Usage: BEFORE_LAYER_CHANGE HEIGHT=<z> LAYER=<index>
gcode:
  {% set height = params.HEIGHT|default(printer.toolhead.position.z)|float %}
  {% set layer = params.LAYER|default(-1)|int + 1 %}
  {% if height >= 0.0 and layer >= 0 %}
    SET_PRINT_STATS_INFO CURRENT_LAYER="{layer}"
    SET_GCODE_VARIABLE MACRO=_LAYER_RUN VARIABLE=cur_height VALUE="{height}"
    {% if printer["gcode_macro _LAYER_RUN"].clearance_z < height %}
      SET_GCODE_VARIABLE MACRO=_LAYER_RUN VARIABLE=clearance_z VALUE="{height}"
    {% endif %}
  {% endif %}

[gcode_macro AFTER_LAYER_CHANGE]
description: Slicer "after layer change" hook — runs pending scheduled commands.
gcode:
  _LAYER_RUN

[gcode_macro GCODE_AT_LAYER]
description: |
  Schedule COMMAND at a layer (LAYER= or LAYER=next) or at HEIGHT (mm). CANCEL=1 removes.
  No args: list scheduled entries. Requires active print (SD/host similar to km check).
gcode:
  {% set info = printer.print_stats.info|default({}) %}
  {% set tot_layers = info.total_layer|default(0)|int %}
  {% if params|length > 0 %}
    {% if printer.idle_timeout.state|string != "Printing" and not (printer.virtual_sdcard|default({})).is_active|default(False) %}
      {action_raise_error("GCODE_AT_LAYER: no print in progress")}
    {% endif %}

    {% set CANCEL = params.CANCEL|default(0)|int != 0 %}
    {% set COMMAND = params.COMMAND|default(None) %}
    {% if COMMAND %}
      {% set parts = COMMAND.lstrip().split(None, 1) %}
      {% set COMMAND = (parts[0]|upper ~ (" " ~ parts[1] if parts|length > 1 else ""))|trim %}
    {% endif %}

    {% if "LAYER" in params %}
      {% set cmd_container = "commands_layer" %}
      {% set cur_layer = info.current_layer|default(0)|int %}
      {% if "HEIGHT" in params %}
        {action_raise_error("GCODE_AT_LAYER: use only HEIGHT or LAYER, not both")}
      {% elif params.LAYER|string|lower == "next" %}
        {% set LAYER = cur_layer + 1 %}
      {% else %}
        {% set LAYER = params.LAYER|int %}
      {% endif %}
      {% if LAYER <= cur_layer %}
        {action_raise_error("GCODE_AT_LAYER: LAYER must be above current layer")}
      {% elif tot_layers and LAYER > tot_layers %}
        {action_raise_error("GCODE_AT_LAYER: LAYER above total_layer")}
      {% endif %}
      {% set key = LAYER %}

    {% elif "HEIGHT" in params %}
      {% set cmd_container = "commands_height" %}
      {% set HEIGHT = params.HEIGHT|float %}
      {% set cur_height = printer["gcode_macro _LAYER_RUN"].cur_height|float %}
      {% if HEIGHT <= cur_height %}
        {action_raise_error("GCODE_AT_LAYER: HEIGHT must be above current print height")}
      {% elif HEIGHT >= printer.toolhead.axis_maximum.z %}
        {action_raise_error("GCODE_AT_LAYER: HEIGHT above max Z")}
      {% endif %}
      {% set key = HEIGHT %}

    {% else %}
      {action_raise_error("GCODE_AT_LAYER: need HEIGHT= or LAYER=")}
    {% endif %}

    {% set lr = printer["gcode_macro _LAYER_RUN"] %}
    {% if cmd_container == "commands_layer" %}
      {% set commands = lr.commands_layer %}
    {% else %}
      {% set commands = lr.commands_height %}
    {% endif %}
    {% if key not in commands and not CANCEL %}
      {% set dummy = commands.__setitem__(key, []) %}
    {% endif %}

    {% if CANCEL %}
      {% if key in commands %}
        {% set pos = ("%i"|format(key)) if key is integer else ("%.3f"|format(key)) %}
        {% if COMMAND %}
          {% if COMMAND in commands[key] %}
            {% set dummy = commands[key].remove(COMMAND) %}
          {% endif %}
          {% if commands[key]|length == 0 %}
            {% set dummy = commands.__delitem__(key) %}
          {% endif %}
          {action_respond_info("GCODE_AT_LAYER: cancelled at " ~ pos ~ ": " ~ COMMAND)}
        {% else %}
          {% set dummy = commands.__delitem__(key) %}
          {action_respond_info("GCODE_AT_LAYER: cancelled all at " ~ pos)}
        {% endif %}
      {% endif %}
    {% elif not COMMAND %}
      {action_raise_error("GCODE_AT_LAYER: COMMAND= required")}
    {% elif COMMAND in commands[key] %}
      {action_raise_error("GCODE_AT_LAYER: duplicate COMMAND")}
    {% else %}
      {% set dummy = commands[key].append(COMMAND) %}
      {% set pos = ("%i"|format(key)) if key is integer else ("%.3f"|format(key)) %}
      {action_respond_info("GCODE_AT_LAYER: scheduled at " ~ pos ~ ":\n* " ~ COMMAND)}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_LAYER_RUN VARIABLE={cmd_container} VALUE="{
        commands|replace('\"','\\\"')}"

  {% else %}
    {% set out = [] %}
    {% set cl = printer["gcode_macro _LAYER_RUN"].commands_layer %}
    {% for key in cl|list|sort %}
      {% set dummy = out.append("layer " ~ key ~ ":") %}
      {% for c in cl[key] %}
        {% set dummy = out.append("  * " ~ c) %}
      {% endfor %}
    {% endfor %}
    {% set ch = printer["gcode_macro _LAYER_RUN"].commands_height %}
    {% for key in ch|list|sort %}
      {% set dummy = out.append("height " ~ (key|string) ~ ":") %}
      {% for c in ch[key] %}
        {% set dummy = out.append("  * " ~ c) %}
      {% endfor %}
    {% endfor %}
    {% if out|length %}
      {action_respond_info(out|join("\n"))}
    {% else %}
      {action_respond_info("GCODE_AT_LAYER: no scheduled commands")}
    {% endif %}
  {% endif %}

[gcode_macro INIT_LAYER_GCODE]
description: |
  Call from slicer PRINT_START with LAYERS=total-1 or total layer count; resets scheduler.
  Usage: INIT_LAYER_GCODE LAYERS=<count>
gcode:
  SET_PRINT_STATS_INFO TOTAL_LAYER="{params.LAYERS|int + 1}" CURRENT_LAYER="{0}"
  SET_GCODE_VARIABLE MACRO=_LAYER_RUN VARIABLE=cur_height VALUE="{0.0}"
  SET_GCODE_VARIABLE MACRO=_LAYER_RUN VARIABLE=clearance_z VALUE="{0.0}"
  SET_GCODE_VARIABLE MACRO=_LAYER_RUN VARIABLE=commands_layer VALUE="{{}}"
  SET_GCODE_VARIABLE MACRO=_LAYER_RUN VARIABLE=commands_height VALUE="{{}}"

[gcode_macro RESET_LAYER_GCODE]
description: Clears layer schedule and print_stats layer info (same as km _RESET_LAYER_GCODE).
gcode:
  SET_PRINT_STATS_INFO TOTAL_LAYER="{0}" CURRENT_LAYER="{0}"
  SET_GCODE_VARIABLE MACRO=_LAYER_RUN VARIABLE=cur_height VALUE="{0.0}"
  SET_GCODE_VARIABLE MACRO=_LAYER_RUN VARIABLE=clearance_z VALUE="{0.0}"
  SET_GCODE_VARIABLE MACRO=_LAYER_RUN VARIABLE=commands_layer VALUE="{{}}"
  SET_GCODE_VARIABLE MACRO=_LAYER_RUN VARIABLE=commands_height VALUE="{{}}"

[gcode_macro CANCEL_ALL_LAYER_GCODE]
description: Clears all scheduled layer/height commands (keeps cur_height/clearance).
gcode:
  SET_GCODE_VARIABLE MACRO=_LAYER_RUN VARIABLE=commands_layer VALUE="{{}}"
  SET_GCODE_VARIABLE MACRO=_LAYER_RUN VARIABLE=commands_height VALUE="{{}}"

[gcode_macro PAUSE_NEXT_LAYER]
description: Schedule PAUSE at the next layer change. Extra params forwarded into COMMAND string.
gcode:
  GCODE_AT_LAYER LAYER=next COMMAND="PAUSE"

[gcode_macro PAUSE_AT_LAYER]
description: Schedule PAUSE at LAYER=n or LAYER=next. Pass HEIGHT= or LAYER= as for GCODE_AT_LAYER.
gcode:
  {% set filtered = [] %}
  {% for k in params|list|sort %}
    {% if k|upper not in ["HEIGHT", "LAYER"] %}
      {% set dummy = filtered.append(k ~ "=" ~ params[k]) %}
    {% endif %}
  {% endfor %}
  {% set suf = (" " ~ filtered|join(" ")) if filtered else "" %}
  GCODE_AT_LAYER {% if "HEIGHT" in params %}HEIGHT={params.HEIGHT}{% else %}LAYER={params.LAYER}{% endif %} COMMAND="PAUSE{{ suf }}"

[gcode_macro SPEED_AT_LAYER]
description: Schedule M220 feedrate % at a layer or height (M220 S same as Marlin).
gcode:
  {% set SPEED = params.SPEED|default(0)|int %}
  {% if SPEED < 1 or SPEED > 500 %}
    {action_raise_error("SPEED_AT_LAYER: SPEED must be 1..500")}
  {% endif %}
  GCODE_AT_LAYER {% if "HEIGHT" in params %}HEIGHT={params.HEIGHT}{% else %}LAYER={params.LAYER}{% endif %} COMMAND="M220 S{SPEED}"

[gcode_macro FLOW_AT_LAYER]
description: Schedule M221 flow % at a layer or height.
gcode:
  {% set FLOW = params.FLOW|default(0)|int %}
  {% if FLOW < 1 or FLOW > 500 %}
    {action_raise_error("FLOW_AT_LAYER: FLOW must be 1..500")}
  {% endif %}
  GCODE_AT_LAYER {% if "HEIGHT" in params %}HEIGHT={params.HEIGHT}{% else %}LAYER={params.LAYER}{% endif %} COMMAND="M221 S{FLOW}"

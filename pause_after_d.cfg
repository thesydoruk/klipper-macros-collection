######################################################################
# PAUSE_AFTER_D
# Pauses the print after an additional D mm of filament has been used
#
# Usage example:
#   PAUSE_AFTER_D D=15
# This will pause the print after 15 mm of additional filament is extruded
# from the moment the command is called.
#
# Parameters:
#   D: Amount of filament to wait before pausing (in millimeters)
#
# Behavior:
# - This macro monitors the filament usage during a print.
# - Once the specified D mm of filament has been used, the macro issues a PAUSE.
# - It uses a delayed_gcode that checks every 0.3 seconds whether the threshold has been reached.
# - A flag `monitoring_active` prevents multiple instances from running at once.
#
# Notes:
# - If the macro is called again while already active, it will be ignored (but not raise an error).
# - This macro is useful for pausing at a known filament length for color swaps or mid-print interventions.
######################################################################

[gcode_macro PAUSE_AFTER_D]
description: Pause the print after an additional D mm of filament extrusion
variable_target_d: 0  # Stores the target filament usage threshold
variable_monitoring_active: False  # Tracks whether the delayed check is active

gcode:
  # Check that the required D parameter was provided
  {% if params.D is not defined %}
    M117 ERROR: D parameter missing!
    RESPOND TYPE=error MSG="D parameter missing for PAUSE_AFTER_D"
    RETURN
  {% endif %}

  # Prevent duplicate monitoring sessions
  {% if printer["gcode_macro PAUSE_AFTER_D"].monitoring_active %}
    M117 Pause after D already active!
    RESPOND TYPE=echo MSG="Pause_after_D is already active; new request ignored."
    RETURN
  {% endif %}

  # Get current filament usage from print_stats
  {% set d_now = printer.print_stats.filament_used | float %}

  # Calculate new target by adding D to current usage
  {% set d_target = d_now + params.D | float %}

  # Store target and enable monitoring flag
  SET_GCODE_VARIABLE MACRO=PAUSE_AFTER_D VARIABLE=target_d VALUE={d_target}
  SET_GCODE_VARIABLE MACRO=PAUSE_AFTER_D VARIABLE=monitoring_active VALUE=True

  # Notify user and start the periodic check
  M117 Will pause in {params.D|float|round(2)} mm
  UPDATE_DELAYED_GCODE ID=PAUSE_AT_D DURATION=0.3

######################################################################
# PAUSE_AT_D
# Delayed macro that periodically checks filament usage
# and triggers PAUSE when the target threshold is reached.
######################################################################

[delayed_gcode PAUSE_AT_D]
description: Checks every 0.3s if the filament target has been reached

initial_duration: 0
gcode:
  # Get current filament usage
  {% set d_now = printer.print_stats.filament_used | float %}

  # Retrieve the target value from the macro
  {% set d_target = printer["gcode_macro PAUSE_AFTER_D"].target_d | float %}
  {% set delta = (d_target - d_now) | round(2) %}

  # If not yet reached, display info and reschedule check
  {% if d_now < d_target - 0.01 %}
    M117 Pausing in {delta} mm
    UPDATE_DELAYED_GCODE ID=PAUSE_AT_D DURATION=0.3

  # If threshold reached, issue PAUSE and clean up state
  {% else %}
    M117 Pausing now
    PAUSE
    SET_GCODE_VARIABLE MACRO=PAUSE_AFTER_D VARIABLE=target_d VALUE=0
    SET_GCODE_VARIABLE MACRO=PAUSE_AFTER_D VARIABLE=monitoring_active VALUE=False
    UPDATE_DELAYED_GCODE ID=PAUSE_AT_D DURATION=0
  {% endif %}
